site_name: Agentic AI Ecosystem

validation:
  unrecognized_links: ignore
site_description: Hands-on guides for local, private agentic AI — RAG, multi-agent crews, MCP, and production APIs.
site_url: https://ayush7614.github.io/agentic-ai-ecosystem/
repo_url: https://github.com/Ayush7614/agentic-ai-ecosystem
repo_name: Ayush7614/agentic-ai-ecosystem
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - include-markdown:
      rewrite_relative_urls: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
    - Qwen Agentic RAG:
      - Overview: guides/qwen-agentic-rag/index.md
      - Full tutorial: guides/qwen-agentic-rag/tutorial.md
    - OpenClaw + Gemma + RAG:
      - Overview: guides/openclaw-gemma-rag/index.md
      - Full tutorial: guides/openclaw-gemma-rag/tutorial.md
    - Claude Code .claude/:
      - Overview: guides/claude-code-dot-claude/index.md
      - Full tutorial: guides/claude-code-dot-claude/tutorial.md
    - Awesome Hermes Agent:
      - Overview: guides/awesome-hermes-agent/index.md
      - Full tutorial: guides/awesome-hermes-agent/tutorial.md
      - Ecosystem catalog: guides/awesome-hermes-agent/ecosystem.md
    - Hermes vs OpenClaw:
      - Overview: guides/hermes-vs-openclaw/index.md
      - Full tutorial: guides/hermes-vs-openclaw/tutorial.md
      - Feature matrix: guides/hermes-vs-openclaw/comparison.md
    - MCP Visual Guide:
      - Overview: guides/mcp-visual-guide/index.md
      - Full tutorial: guides/mcp-visual-guide/tutorial.md
  - Publishing: publishing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ayush7614/agentic-ai-ecosystem
