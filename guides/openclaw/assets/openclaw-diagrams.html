<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OpenClaw — Diagrams</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0b1020;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif}
    #capture{width:1100px;padding:32px 36px;background:linear-gradient(165deg,#0b1020,#1a2a1a 45%,#0b1020);border-radius:20px;border:1px solid rgba(255,140,80,.2)}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#ff9f6b;margin-bottom:8px}
    h1{font-size:24px;font-weight:800;color:#f8fafc;margin-bottom:20px} h1 span{color:#6ee7b7}
    .row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
    .node{opacity:.15;transform:translateY(8px);min-width:100px;padding:14px 14px;border-radius:12px;background:rgba(15,23,42,.85);border:1px solid rgba(51,65,85,.8);text-align:center}
    .node.visible{opacity:1;transform:none}.node.active{border-color:#ff9f6b;box-shadow:0 0 20px rgba(255,159,107,.15)}
    .node h2{font-size:11px;color:#f1f5f9;line-height:1.35}
    .arrow{color:#475569;font-size:18px;opacity:.2}.arrow.visible{opacity:1;color:#ff9f6b}
    .stack{display:flex;flex-direction:column;gap:10px;max-width:540px;margin:0 auto}
    .tier{opacity:.15;transform:translateX(-8px);padding:12px 16px;border-radius:10px;border:1px solid rgba(51,65,85,.7);background:rgba(15,23,42,.75);font-size:12px;color:#cbd5e1}
    .tier.visible{opacity:1;transform:none}.tier.active{border-color:#ff9f6b}
    .tier strong{color:#ff9f6b;display:block;margin-bottom:4px;font-size:11px}
    .tree{font-family:"JetBrains Mono",monospace;font-size:11px;color:#cbd5e1;line-height:1.75}
    .tree div{opacity:.15}.tree div.visible{opacity:1}.tree .hl{color:#6ee7b7}
    .ring{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
    .pill{opacity:.15;transform:scale(.95);padding:8px 14px;border-radius:999px;background:rgba(255,159,107,.12);border:1px solid rgba(255,159,107,.3);font-size:11px;color:#fed7aa;font-weight:600}
    .pill.visible{opacity:1;transform:scale(1)}.pill.active{background:rgba(255,159,107,.25)}
  </style>
</head>
<body>
  <div id="capture"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><div id="content"></div></div>
  <script>
    const D = {
      "gateway-flow": { eyebrow:"OpenClaw", title:'Chat apps <span>→ agent</span>', nodes:["WhatsApp","Telegram","Discord","Gateway","Agent","Tools"] },
      "gateway-arch": { eyebrow:"Control plane", title:'Gateway <span>:18789</span>', nodes:["Channels","Gateway","Runtime","Workspace","Control UI","LLM"] },
      "workspace": { eyebrow:"~/.openclaw", title:'Workspace <span>layout</span>', type:"tree",
        lines:["~/.openclaw/","├── openclaw.json","├── workspace/","│   ├── SOUL.md · AGENTS.md","│   └── skills/*/SKILL.md","└── credentials/ · sessions/"] },
      "capabilities": { eyebrow:"Product", title:'What it <span>does</span>', type:"stack",
        tiers:[["Your machine","Private · any OS · your models"],["Any chat app","DMs + groups · 50+ integrations"],["Memory","Persists preferences across sessions"],["Browser + shell","Forms · files · scripts"],["Skills","ClawHub · self-authored · plugins"]] },
      "channels": { eyebrow:"Integrations", title:'Works <span>with</span>', type:"pills",
        pills:["WhatsApp","Telegram","Discord","Slack","Signal","iMessage","Gmail","GitHub","Spotify","Obsidian"] },
      "skill-levels": { eyebrow:"Skills", title:'Progressive <span>load</span>', nodes:["Catalog","SKILL.md","references/"] },
      "cron-heartbeat": { eyebrow:"Proactive", title:'Cron + <span>heartbeat</span>', nodes:["Schedule","Gateway tick","Isolated run","Deliver to chat"] },
      "multi-agent": { eyebrow:"Routing", title:'Multi-agent <span>sessions</span>', nodes:["Sender A","Agent 1","Sender B","Agent 2","Shared Gateway"] },
    };
    function flow(nodes, prog) {
      const total = nodes.length * 2 - 1, vis = Math.ceil(prog * total);
      let html = '<div class="row">', idx = 0;
      nodes.forEach((n,i) => {
        html += `<div class="node${idx<vis?" visible":""}${idx===vis-1?" active":""}"><h2>${n}</h2></div>`; idx++;
        if (i < nodes.length-1) { html += `<span class="arrow${idx<vis?" visible":""}">→</span>`; idx++; }
      });
      return html + '</div>';
    }
    function render(id, prog) {
      const d = D[id]; if (!d) return;
      document.getElementById("eyebrow").textContent = d.eyebrow;
      document.getElementById("title").innerHTML = d.title;
      const el = document.getElementById("content");
      if (d.type === "stack") {
        const vis = Math.ceil(prog * d.tiers.length);
        el.innerHTML = '<div class="stack">' + d.tiers.map((t,i)=>
          `<div class="tier${i<vis?" visible":""}${i===vis-1?" active":""}"><strong>${t[0]}</strong>${t[1]}</div>`).join('') + '</div>';
      } else if (d.type === "tree") {
        const vis = Math.ceil(prog * d.lines.length);
        el.innerHTML = '<div class="tree">' + d.lines.map((l,i)=>
          `<div class="${i<vis?"visible":""} ${i===0?"hl":""}">${l}</div>`).join('') + '</div>';
      } else if (d.type === "pills") {
        const vis = Math.ceil(prog * d.pills.length);
        el.innerHTML = '<div class="ring">' + d.pills.map((p,i)=>
          `<span class="pill${i<vis?" visible":""}${i===vis-1?" active":""}">${p}</span>`).join('') + '</div>';
      } else el.innerHTML = flow(d.nodes, prog);
    }
    const p = new URLSearchParams(location.search);
    render(p.get("diagram")||"gateway-flow", parseFloat(p.get("frame")||"1"));
    window.__READY = true;
  </script>
</body>
</html>
