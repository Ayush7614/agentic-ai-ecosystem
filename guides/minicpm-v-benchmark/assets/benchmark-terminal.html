<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Nunito:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#1a2744,#0f172a 60%);font-family:"JetBrains Mono",monospace}
#capture{width:960px;padding:24px}
.terminal{border-radius:12px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55);background:#1e1e24}
.titlebar{height:40px;background:#2d2d35;display:flex;align-items:center;padding:0 14px;gap:7px}
.dot{width:12px;height:12px;border-radius:50%}.dot.red{background:#ff5f57}.dot.yellow{background:#febc2e}.dot.green{background:#28c840}
.titlebar-label{flex:1;text-align:center;font-size:11px;color:#8a8a90;margin-right:40px}
.body{padding:24px 28px;background:#18181c;font-size:12.5px;line-height:1.65;color:#d4d4d8;min-height:340px}
.line{white-space:pre-wrap;margin-bottom:2px}
.cmd{color:#f0f0f4}.success{color:#6fdc8c}.info{color:#5eb3ff}.dim{color:#8b8b95}
.prompt-user{color:#ff9f6b}.prompt-path{color:#5eb3ff}.prompt-arrow{color:#e06cff;margin:0 5px}
</style>
</head>
<body>
<div id="capture"><div class="terminal">
<div class="titlebar"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
<span class="titlebar-label">Terminal — minicpm-v-benchmark</span></div>
<div class="body" id="body"></div></div></div>
<script>
const L=[
{t:"cmd",x:"python scripts/benchmark.py"},
{t:"info",x:"==> minicpm-v4.6"},
{t:"success",x:"TTFT 222 ms · 103 tok/s · vision 1159 ms"},
{t:"info",x:"==> qwen3.5:0.8b  (ollama pull to measure)"},
{t:"info",x:"==> gemma4:e2b    (ollama pull to measure)"},
{t:"success",x:"Wrote results/report.md"},
{t:"dim",x:"# 16 GB Mac · Ollama local · verified minicpm-v4.6"},
];
function pr(){return `<span class="prompt-user">(venv) ayush@Mac-mini</span><span class="prompt-path"> benchmark</span><span class="prompt-arrow">%</span> `;}
const p=parseFloat(new URLSearchParams(location.search).get('frame')||'1');
const n=Math.ceil(p*L.length);let h='';
for(let i=0;i<n;i++){const l=L[i];h+=l.t==='cmd'?`<div class="line">${pr()}<span class="cmd">${l.x}</span></div>`:`<div class="line ${l.t}">${l.x}</div>`;}
document.getElementById('body').innerHTML=h;window.__READY=true;
</script>
</body>
</html>
