<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cybersec Skills — Install Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #3a3a42 0%, #1c1c20 55%, #121214 100%);
      font-family: "JetBrains Mono", "SF Mono", Menlo, Monaco, monospace;
    }

    #capture {
      width: 920px;
      padding: 28px;
    }

    .terminal {
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      background: #2a2a2e;
    }

    .titlebar {
      height: 44px;
      background: linear-gradient(180deg, #3a3a3e 0%, #323236 100%);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.35);
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
    }

    .dot.red { background: #ff5f57; box-shadow: inset 0 -1px 2px rgba(0,0,0,0.2); }
    .dot.yellow { background: #febc2e; box-shadow: inset 0 -1px 2px rgba(0,0,0,0.2); }
    .dot.green { background: #28c840; box-shadow: inset 0 -1px 2px rgba(0,0,0,0.2); }

    .titlebar-label {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: #8a8a90;
      margin-right: 52px;
      letter-spacing: 0.02em;
    }

    .body {
      min-height: 320px;
      padding: 28px 32px 36px;
      background: #28282c;
      font-size: 15px;
      line-height: 1.75;
      color: #d4d4d8;
    }

    .line { white-space: pre-wrap; word-break: break-all; }

    .prompt-user { color: #6fdc8c; font-weight: 500; }
    .prompt-path { color: #5eb3ff; }
    .prompt-arrow { color: #e06cff; margin: 0 6px 0 2px; }

    .cmd { color: #f0f0f4; }
    .dim { color: #8b8b95; }
    .success { color: #6fdc8c; }
    .info { color: #5eb3ff; }
    .warn { color: #febc2e; }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 18px;
      background: #c8c8cc;
      vertical-align: text-bottom;
      margin-left: 1px;
    }

    .cursor.blink { animation: blink 1.05s step-end infinite; }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .spacer { height: 10px; }
  </style>
</head>
<body>
  <div id="capture">
    <div class="terminal">
      <div class="titlebar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="titlebar-label">Terminal — zsh</span>
      </div>
      <div class="body" id="terminal-body"></div>
    </div>
  </div>

  <script>

        ],

      },
      "07-codex": {
        user: "techlatest",
        path: "~",

          { type: "cmd", text: "npx skills add mukul975/Anthropic-Cybersecurity-Skills" },
          { type: "success", text: "✔ 754 skills → ~/.codex/skills/ (Codex CLI)" },

          { type: "success", text: "Matched 32 skills · top 3 loaded" },
          { type: "out", text: "• performing-memory-forensics-with-volatility3" },
          { type: "out", text: "• extracting-credentials-from-memory-dump" },

          { type: "out", text: "vol -f server01.raw windows.pslist | grep -i lsass" },
          { type: "out", text: "vol -f server01.raw windows.malfind | head -20" },

        showCursor: false,
      },
    };

    function prompt(user, path) {
      return `<span class="prompt-user">${user}</span><span class="prompt-path"> (${path})</span><span class="prompt-arrow">⇒</span>`;
    }

    function renderLine(line, user, path, isLastCmd) {
      if (line.type === "cmd") {
        const cur = isLastCmd ? '<span class="cursor blink"></span>' : "";
        return `<div class="line">${prompt(user, path)}<span class="cmd">${line.text}</span>${cur}</div>`;
      }
      const cls = line.type === "success" ? "success" : line.type === "info" ? "info" : line.type === "warn" ? "warn" : line.type === "dim" ? "dim" : "dim";
      if (line.text === "") return '<div class="spacer"></div>';
      return `<div class="line ${cls}">${line.text}</div>`;
    }

    function renderStep(stepId, progress) {
      const step = STEPS[stepId];
      if (!step) return;

      const body = document.getElementById("terminal-body");
      const totalLines = step.lines.length;
      const visibleCount = progress === undefined ? totalLines : Math.min(totalLines, Math.ceil(progress * totalLines));

      let html = "";
      let lastCmdIdx = -1;
      for (let i = 0; i < visibleCount; i++) {
        if (step.lines[i].type === "cmd") lastCmdIdx = i;
      }

      for (let i = 0; i < visibleCount; i++) {
        const isLastCmd = i === lastCmdIdx && step.showCursor !== false && visibleCount === totalLines;
        html += renderLine(step.lines[i], step.user, step.path, isLastCmd);
      }

      if (visibleCount === 0) {
        html = `<div class="line">${prompt(step.user, step.path)}<span class="cursor blink"></span></div>`;
      }

      body.innerHTML = html;
    }

    const params = new URLSearchParams(location.search);
    const stepId = params.get("step") || "01-npx";
    const frame = params.get("frame");

    if (frame !== null) {
      const f = parseFloat(frame);
      renderStep(stepId, f);
    } else {
      renderStep(stepId);
    }

    window.__READY = true;
  </script>
</body>
</html>
