<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Loop Engineering — Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1200px;height:600px;overflow:hidden;
      font-family:"JetBrains Mono",Menlo,monospace}
    body{display:flex;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at 50% 30%,#1e1b4b 0%,#0f172a 55%,#020617 100%)}
    #capture{width:1200px;height:600px;padding:40px 48px;display:flex;align-items:center;justify-content:center}
    .terminal{width:100%;height:100%;border-radius:16px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55);
      background:#1e1e24;border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column}
    .titlebar{height:52px;flex-shrink:0;background:linear-gradient(180deg,#2d2d35,#25252c);
      display:flex;align-items:center;padding:0 20px;gap:10px;border-bottom:1px solid rgba(0,0,0,.35)}
    .dot{width:15px;height:15px;border-radius:50%}
    .dot.red{background:#ff5f57}.dot.yellow{background:#febc2e}.dot.green{background:#28c840}
    .titlebar-label{flex:1;text-align:center;font-size:14px;color:#8a8a90;margin-right:60px}
    .body{flex:1;padding:32px 40px;background:#18181c;font-size:17px;line-height:1.75;color:#d4d4d8;overflow:hidden}
    .line{white-space:pre-wrap;word-break:break-all}
    .prompt-user{color:#f472b6;font-weight:500}.prompt-path{color:#38bdf8}
    .prompt-arrow{color:#a78bfa;margin:0 6px 0 2px}
    .cmd{color:#f0f0f4}.dim{color:#8b8b95}.success{color:#6fdc8c}.info{color:#38bdf8}.warn{color:#fbbf24}
  </style>
</head>
<body>
  <div id="capture"><div class="terminal">
    <div class="titlebar"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      <span class="titlebar-label">Terminal — Loop Engineering</span></div>
    <div class="body" id="terminal-body"></div>
  </div></div>
  <script>
    const STEPS = {
      "01-loop-scaffold": { user:"techlatest", path:"~/loop-agent", lines:[
        { type:"cmd", text:"mkdir loop-agent && cd loop-agent" },
        { type:"cmd", text:"cp ../examples/minimal_closed_loop.py ." },
        { type:"cmd", text:"cp ../examples/eval-gate.yaml ." },
        { type:"success", text:"Scaffold: loop script + eval gate config" },
      ]},
      "02-test-gate": { user:"techlatest", path:"~/loop-agent", lines:[
        { type:"cmd", text:"python minimal_closed_loop.py" },
        { type:"out", text:"# iter 1: initial implementation" },
        { type:"warn", text:"  eval: FAILED: test_addition expected 4 got 3" },
        { type:"out", text:"# iter 2: patch based on → FAILED..." },
        { type:"success", text:"  eval: OK: 12 passed" },
        { type:"success", text:"✓ All unit tests pass (stopped at iteration 2)" },
      ]},
      "03-eval-yaml": { user:"techlatest", path:"~/loop-agent", lines:[
        { type:"cmd", text:"cat eval-gate.yaml" },
        { type:"out", text:"goal: All pytest pass; ruff clean" },
        { type:"info", text:"success: pytest_exit_code == 0" },
        { type:"info", text:"failure: max_iterations: 10 · no_progress_streak: 3" },
        { type:"success", text:"escalation: human_review on failure" },
      ]},
      "04-max-iterations": { user:"techlatest", path:"~/loop-agent", lines:[
        { type:"out", text:"iter 8 · eval FAIL (same TypeError)" },
        { type:"out", text:"iter 9 · eval FAIL (same TypeError)" },
        { type:"out", text:"iter 10 · eval FAIL (same TypeError)" },
        { type:"warn", text:"no_progress_streak=3 → halt loop" },
        { type:"success", text:"✗ Escalate to human — include iteration_log" },
      ]},
      "05-multi-agent": { user:"techlatest", path:"~/loop-agent", lines:[
        { type:"cmd", text:"orchestrator run --goal 'Ship auth module'" },
        { type:"info", text:"→ planner: 3 subtasks" },
        { type:"info", text:"→ coder loop until pytest green" },
        { type:"info", text:"→ reviewer loop until rubric pass" },
        { type:"success", text:"global eval PASS · fleet idle" },
      ]},
    };
    function prompt(u,p){return `<span class="prompt-user">${u}</span><span class="prompt-path"> (${p})</span><span class="prompt-arrow">⇒</span>`;}
    function renderStep(id, progress) {
      const s = STEPS[id]; if (!s) return;
      const vis = Math.ceil(progress * s.lines.length);
      let html = "";
      for (let i = 0; i < vis; i++) {
        const L = s.lines[i];
        if (L.type === "cmd") html += `<div class="line">${prompt(s.user,s.path)}<span class="cmd">${L.text}</span></div>`;
        else if (L.type === "success") html += `<div class="line success">${L.text}</div>`;
        else if (L.type === "info") html += `<div class="line info">${L.text}</div>`;
        else if (L.type === "warn") html += `<div class="line warn">${L.text}</div>`;
        else if (L.type === "dim") html += `<div class="line dim">${L.text}</div>`;
        else html += `<div class="line">${L.text}</div>`;
      }
      document.getElementById("terminal-body").innerHTML = html;
    }
    const p = new URLSearchParams(location.search);
    renderStep(p.get("step")||"01-loop-scaffold", parseFloat(p.get("frame")||"1"));
    window.__READY = true;
  </script>
</body>
</html>
