<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif}
#capture{width:1100px;padding:32px 36px;background:linear-gradient(165deg,#0a0a0a,#141414 50%,#0a0a0a);border-radius:20px;border:1px solid rgba(255,255,255,.08)}
.ey{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a3a3a3;margin-bottom:8px}
h1{font-size:24px;font-weight:800;color:#fafafa;margin-bottom:20px} h1 span{color:#fafafa;text-decoration:underline;text-underline-offset:4px}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.node{opacity:.15;transform:translateY(8px);min-width:110px;padding:14px 16px;border-radius:12px;background:rgba(20,20,20,.9);border:1px solid rgba(64,64,64,.8);text-align:center}
.node.visible{opacity:1;transform:none}.node.active{border-color:#fafafa;box-shadow:0 0 20px rgba(255,255,255,.08)}
.node h2{font-size:12px;color:#fafafa;margin-bottom:4px}.node p{font-size:10px;color:#a3a3a3;line-height:1.4}
.arrow{color:#525252;font-size:20px;opacity:.2}.arrow.visible{opacity:1;color:#fafafa}
.stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:560px;margin:0 auto}
.tier{opacity:.15;transform:translateX(-8px);padding:12px 16px;border-radius:10px;border:1px solid rgba(64,64,64,.7);background:rgba(20,20,20,.8)}
.tier.visible{opacity:1;transform:none}.tier.active{border-color:#fafafa}
.tier strong{color:#e5e5e5;font-size:12px;display:block;margin-bottom:4px}.tier span{font-size:11px;color:#a3a3a3}
</style>
</head>
<body>
<div id="capture"><div class="ey" id="ey"></div><h1 id="title"></h1><div id="content"></div></div>
<script>
const D={
"opencode-stack":{ey:"OpenCode",title:'Coding <span>harness</span>',nodes:["TUI · Desktop · IDE","build · plan agents","Tools + LSP","MCP · Skills","Model provider"]},
"build-plan":{ey:"Agents",title:'Build vs <span>Plan</span>',nodes:["Tab toggle","Plan · read-only","Iterate design","Build · full access","Ship code"]},
"mcp-tools":{ey:"Extensions",title:'MCP + <span>tools</span>',nodes:["Built-in tools","MCP server","Schema in context","Sandbox exec","Observation loop"]},
};
function flow(nodes,prog){const total=nodes.length*2-1;const vis=Math.ceil(prog*total);let html='<div class="row">',idx=0;
nodes.forEach((n,i)=>{html+=`<div class="node${idx<vis?" visible":""}${idx===vis-1?" active":""}"><h2>${n}</h2></div>`;idx++;
if(i<nodes.length-1){html+=`<span class="arrow${idx<vis?" visible":""}">→</span>`;idx++;}});return html+'</div>';}
function render(id,prog){const d=D[id];if(!d)return;document.getElementById("ey").textContent=d.ey;
document.getElementById("title").innerHTML=d.title;document.getElementById("content").innerHTML=flow(d.nodes,prog);}
const p=new URLSearchParams(location.search);render(p.get("diagram")||"opencode-stack",parseFloat(p.get("frame")||"1"));
window.__READY=true;
</script>
</body>
</html>
