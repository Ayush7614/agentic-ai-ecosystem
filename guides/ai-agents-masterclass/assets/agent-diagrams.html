<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#fff;--text:#1e293b;--muted:#64748b;--blue:#e8f4fc;--blue-b:#7eb8da;--purple:#eee8f8;--purple-b:#b8a9d4;--yellow:#fff8e7;--yellow-b:#e8c86a;--green:#e8f8ef;--green-b:#6bc49a;--hl:#c8f0d8;--dash:#94a3b8;--shadow:0 3px 14px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:600px;overflow:hidden;font-family:Nunito,sans-serif}
body{background:var(--bg);display:flex;align-items:center;justify-content:center}
#capture{width:1200px;height:600px;padding:28px 40px 24px;background:var(--bg);display:flex;flex-direction:column}
.eyebrow{font-family:Caveat,cursive;font-size:22px;font-weight:700;color:var(--muted);margin-bottom:2px}
h1{font-family:Caveat,cursive;font-size:42px;font-weight:700;color:var(--text);margin-bottom:18px;line-height:1.1}
h1 span{color:#2d9f6f}h1 .pill{display:inline-block;background:var(--hl);border-radius:999px;padding:0 14px}
#content{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.box{border-radius:14px;border:2px solid;box-shadow:var(--shadow);text-align:center}
.box.blue{background:var(--blue);border-color:var(--blue-b)}.box.purple{background:var(--purple);border-color:var(--purple-b)}
.box.yellow{background:var(--yellow);border-color:var(--yellow-b)}.box.green{background:var(--green);border-color:var(--green-b)}
.fade{opacity:.12;transform:translateY(6px) scale(.97)}.fade.on{opacity:1;transform:none}
.fade.hot{box-shadow:0 0 0 3px rgba(45,159,111,.25),var(--shadow)}
.ic{font-size:28px}.lb{font-family:Caveat,cursive;font-size:18px;font-weight:700;color:var(--text);margin-top:4px}
.sm{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.dash{color:var(--dash);font-size:22px;font-weight:700;opacity:.15}.dash.on{opacity:1}
.row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;width:100%}
.node{min-width:115px;padding:16px 12px;border-radius:14px;border:2px solid var(--blue-b);background:var(--blue);box-shadow:var(--shadow);opacity:.12;transform:translateY(6px)}
.node.on{opacity:1;transform:none}.node.hot{box-shadow:0 0 0 3px rgba(45,159,111,.2),var(--shadow)}
.node h2{font-family:Caveat,cursive;font-size:17px;font-weight:700}
.cols{display:flex;gap:18px;justify-content:center;width:100%;max-width:1050px}
.col{flex:1;padding:18px 14px;border-radius:16px;border:2px solid;opacity:.12;transform:translateY(6px);box-shadow:var(--shadow)}
.col.on{opacity:1;transform:none}.col.a{background:var(--blue);border-color:var(--blue-b)}
.col.b{background:var(--purple);border-color:var(--purple-b)}.col.c{background:var(--yellow);border-color:var(--yellow-b)}
.col h3{font-family:Caveat,cursive;font-size:20px;font-weight:700;margin-bottom:8px}
.col p,.col li{font-size:12px;color:var(--muted);line-height:1.5;font-weight:600}
.col ul{margin-left:14px;text-align:left}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:900px;width:100%}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:1000px;width:100%}
.cell{padding:16px 10px;border-radius:14px;border:2px solid var(--green-b);background:var(--green);box-shadow:var(--shadow);opacity:.12}
.cell.on{opacity:1}.cell.hot{box-shadow:0 0 0 3px rgba(45,159,111,.2),var(--shadow)}
.anatomy{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:820px;width:100%}
.anat{padding:20px 16px}
.ladder{display:flex;flex-direction:column;gap:8px;max-width:700px;width:100%}
.rung{display:flex;align-items:center;gap:12px;opacity:.12;transform:translateX(-8px)}
.rung.on{opacity:1;transform:none}
.rung .n{width:32px;height:32px;border-radius:50%;background:var(--purple);border:2px solid var(--purple-b);font-family:Caveat,cursive;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rung .b{flex:1;padding:12px 16px;border-radius:12px;border:2px solid var(--blue-b);background:var(--blue);text-align:left}
.rung .b h3{font-family:Caveat,cursive;font-size:18px;font-weight:700}
.rung .b p{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.hub{position:relative;width:100%;height:360px}
.hub-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;padding:18px}
.spoke{position:absolute;opacity:.12;transform:scale(.92)}.spoke.on{opacity:1;transform:scale(1)}
.spoke .box{padding:10px 8px;min-width:95px}.spoke .ic{font-size:22px}.spoke .lb{font-size:15px}
.split{display:flex;gap:28px;max-width:920px;width:100%;align-items:stretch}
.panel{flex:1;padding:22px;border-radius:16px;border:2px solid;box-shadow:var(--shadow);opacity:.12}
.panel.on{opacity:1}.panel.surf{background:var(--blue);border-color:var(--blue-b)}
.panel.back{background:var(--yellow);border-color:var(--yellow-b)}
.panel h3{font-family:Caveat,cursive;font-size:22px;font-weight:700;margin-bottom:10px}
.panel p{font-size:13px;color:var(--muted);line-height:1.55;font-weight:600}
.fw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:1040px;width:100%}
.fw-cell{padding:12px 8px;border-radius:12px;border:1.5px solid var(--purple-b);background:var(--purple);opacity:.12;font-size:11px;font-weight:700;text-align:center}
.fw-cell.on{opacity:1}.fw-cell .nm{font-family:Caveat,cursive;font-size:15px;font-weight:700;display:block;margin-bottom:2px}
.cycle{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;max-width:950px}
.cyc{padding:14px 12px;min-width:100px;border-radius:14px;border:2px solid var(--green-b);background:var(--green);opacity:.12}
.cyc.on{opacity:1}.cyc h3{font-family:Caveat,cursive;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div id="capture"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><div id="content"></div></div>
<script>
const SPOKES=[
  {ic:"🧠",lb:"Reasoning",x:"8%",y:"12%"},{ic:"⚡",lb:"Acting",x:"78%",y:"8%"},
  {ic:"👁️",lb:"Observing",x:"82%",y:"55%"},{ic:"📋",lb:"Planning",x:"58%",y:"78%"},
  {ic:"🤝",lb:"Collaborating",x:"10%",y:"68%"},{ic:"🔄",lb:"Self-refining",x:"2%",y:"38%"}
];
const CX=600,CY=210;
const D={
  "agent-definition":{eyebrow:"",title:'What is an <span class="pill">AI Agent</span>?',type:"hub"},
  "agent-vs-assistant":{eyebrow:"Compare",title:'Agent vs <span>Assistant</span> vs Bot',type:"triple"},
  "agent-anatomy":{eyebrow:"Components",title:'Persona · Memory · <span>Tools</span> · Model',type:"anatomy"},
  "react-loop":{eyebrow:"ReAct",title:'Think · Act · <span>Observe</span>',nodes:["Think","Act","Observe","Update plan"]},
  "rewoo-flow":{eyebrow:"ReWOO",title:'Plan · Execute · <span>Synthesize</span>',nodes:["Plan upfront","Tool outputs","Final answer"]},
  "agent-types-ladder":{eyebrow:"Classical AI",title:'Five agent <span>types</span>',type:"ladder"},
  "memory-tiers":{eyebrow:"Memory",title:'Short · Long · <span>Episodic</span> · Consensus',type:"grid4"},
  "single-multi":{eyebrow:"Topology",title:'Single vs <span>Multi-agent</span>',type:"split2"},
  "surface-background":{eyebrow:"Interaction",title:'Surface vs <span>Background</span>',type:"surface"},
  "use-cases-six":{eyebrow:"Use cases",title:'Six agent <span>categories</span>',type:"usecases"},
  "frameworks-map":{eyebrow:"Frameworks",title:'Agent framework <span>landscape</span>',type:"frameworks"},
  "lifecycle":{eyebrow:"Ops",title:'Design · Build · <span>Deploy · Monitor</span>',nodes:["Design","Build","Deploy","Monitor","Iterate"]},
  "goal-planning":{eyebrow:"Stage 1",title:'Goal · Decompose · <span>Plan</span>',nodes:["User goal","Task decomposition","Subtasks","Execute"]},
  "tool-reasoning":{eyebrow:"Stage 2",title:'Perceive · Tools · <span>Reason</span>',nodes:["Missing info","Call tools","Update knowledge","Decide"]},
  "learning-loop":{eyebrow:"Stage 3",title:'Feedback · Memory · <span>Refine</span>',nodes:["Human feedback","Agent feedback","Store memory","Improve"]},
  "governance":{eyebrow:"Safety",title:'Logs · HITL · <span>Interrupt</span>',type:"grid4gov"},
  "cloud-deploy":{eyebrow:"Deploy",title:'Cloud Run · <span>Scale · A2A</span>',type:"cycle"},
  "protocols":{eyebrow:"Interop",title:'MCP · A2A · <span>REST</span>',nodes:["MCP tools","A2A agents","REST APIs","Orchestrator"]},
};

function hubConn(s){
  const bx=parseFloat(s.x)/100*1120+40+48,by=parseFloat(s.y)/100*360+28+36;
  const dx=CX-bx,dy=CY-by,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;
  return {bx,by,len,ang,mx:(bx+CX)/2,my:(by+CY)/2};
}
function renderHub(prog){
  const vis=Math.ceil(prog*7);
  let h='<div class="hub">';
  SPOKES.forEach((s,i)=>{
    const on=i+2<=vis;const c=hubConn(s);
    h+=`<div class="spoke${on?' on':''}" style="left:${s.x};top:${s.y}"><div class="box yellow"><div class="ic">${s.ic}</div><div class="lb">${s.lb}</div></div></div>`;
  });
  h+=`<div class="hub-c box blue fade${vis>=1?' on':''}"><div class="ic">🤖</div><div class="lb">AI Agent</div><div class="sm">autonomous · goal-driven</div></div></div>`;
  return h;
}
function renderTriple(prog){
  const cols=[
    ["AI Agent","Autonomous · multi-step · learns · decides independently","Proactive · goal-oriented"],
    ["AI Assistant","Responds to prompts · recommends · user decides","Reactive · embedded in product"],
    ["Bot","Pre-defined rules · limited learning","Reactive · trigger-based"]
  ];
  const v=Math.ceil(prog*3);
  return '<div class="cols">'+cols.map((c,i)=>`<div class="col ${['a','b','c'][i]}${i<v?' on':''}"><h3>${c[0]}</h3><p>${c[1]}</p><p style="margin-top:8px"><b>Interaction:</b> ${c[2]}</p></div>`).join('')+'</div>';
}
function renderAnatomy(prog){
  const p=[["🎭","Persona","Role · tone · instructions"],["🧩","Memory","Short · long · episodic"],["🔧","Tools","APIs · DB · agents · code"],["🧠","Model","LLM reasoning core"]];
  const v=Math.ceil(prog*4);
  return '<div class="anatomy">'+p.map((x,i)=>`<div class="box ${['purple','blue','yellow','green'][i]} anat fade${i<v?' on':''}${i===v-1?' hot':''}"><div class="ic">${x[0]}</div><div class="lb">${x[1]}</div><div class="sm">${x[2]}</div></div>`).join('')+'</div>';
}
function renderLadder(prog){
  const r=[
    ["1","Simple reflex","Condition → action · no memory"],
    ["2","Model-based reflex","Internal world model · partial observability"],
    ["3","Goal-based","Search & plan actions toward goal"],
    ["4","Utility-based","Maximize reward / utility function"],
    ["5","Learning","Critic · performance · problem generator"]
  ];
  const v=Math.ceil(prog*5);
  return '<div class="ladder">'+r.map((x,i)=>`<div class="rung${i<v?' on':''}"><div class="n">${x[0]}</div><div class="b"><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join('')+'</div>';
}
function renderGrid4(ids,prog){
  const v=Math.ceil(prog*4);
  return '<div class="grid4">'+ids.map((x,i)=>`<div class="cell${i<v?' on':''}${i===v-1?' hot':''}"><div class="ic">${x[0]}</div><div class="lb">${x[1]}</div><div class="sm">${x[2]||''}</div></div>`).join('')+'</div>';
}
function renderSplit2(prog){
  const v=Math.ceil(prog*2);
  return `<div class="split">
    <div class="panel surf${v>=1?' on':''}"><h3>Single agent</h3><p>One LLM · one tool set · one goal. Best for well-defined tasks. Simpler ops and debugging.</p></div>
    <div class="panel back${v>=2?' on':''}"><h3>Multi-agent</h3><p>Specialized agents collaborate or compete. Route by capability. Higher quality via division of labor.</p></div></div>`;
}
function renderSurface(prog){
  const v=Math.ceil(prog*2);
  return `<div class="split">
    <div class="panel surf${v>=1?' on':''}"><h3>Surface agents</h3><p>Conversational · Q&A · customer service · copilots. User-query triggered. Visible in UI.</p></div>
    <div class="panel back${v>=2?' on':''}"><h3>Background agents</h3><p>Workflow automation · event-driven queues · monitoring. Limited human interaction. Runs behind the scenes.</p></div></div>`;
}
function renderUsecases(prog){
  const u=[["👥","Customer","Support · sales · personalization"],["💼","Employee","HR · docs · productivity"],["🎨","Creative","Content · design · campaigns"],["📊","Data","Analysis · insights · integrity"],["💻","Code","Generation · review · refactor"],["🛡️","Security","Detect · investigate · respond"]];
  const v=Math.ceil(prog*6);
  return '<div class="grid3">'+u.map((x,i)=>`<div class="cell${i<v?' on':''}"><div class="ic">${x[0]}</div><div class="lb">${x[1]}</div><div class="sm">${x[2]}</div></div>`).join('')+'</div>';
}
function renderFrameworks(prog){
  const f=[["LangGraph","graphs"],["CrewAI","crews"],["AutoGen","chat"],["OpenAI SDK","tools"],["Google ADK","cloud"],["Pydantic AI","types"],["LlamaIndex","RAG"],["Semantic Kernel","plugins"],["Smolagents","HF"],["Hermes","learn"],["Mastra","TS"],["Agno","fast"]];
  const v=Math.ceil(prog*12);
  return '<div class="fw">'+f.map((x,i)=>`<div class="fw-cell${i<v?' on':''}"><span class="nm">${x[0]}</span>${x[1]}</div>`).join('')+'</div>';
}
function renderCycle(prog){
  const c=["User/API","Cloud Run","Agent service","Scale 0→N","A2A mesh"];
  const v=Math.ceil(prog*5);
  return '<div class="cycle">'+c.map((x,i)=>{let h=`<div class="cyc${i<v?' on':''}"><h3>${x}</h3></div>`;
    if(i<c.length-1)h+=`<span class="dash${i+1<v?' on':''}">→</span>`;return h;}).join('')+'</div>';
}
function flow(nodes,prog){
  const total=nodes.length*2-1,vis=Math.ceil(prog*total);let h='<div class="row">',idx=0;
  nodes.forEach((n,i)=>{h+=`<div class="node${idx<vis?' on':''}${idx===vis-1?' hot':''}"><h2>${n}</h2></div>`;idx++;
    if(i<nodes.length-1){h+=`<span class="dash${idx<vis?' on':''}">→</span>`;idx++;}});
  return h+'</div>';
}
function render(id,prog){
  const d=D[id];if(!d)return;
  document.getElementById("eyebrow").textContent=d.eyebrow;
  document.getElementById("title").innerHTML=d.title;
  const el=document.getElementById("content");
  if(d.type==="hub")el.innerHTML=renderHub(prog);
  else if(d.type==="triple")el.innerHTML=renderTriple(prog);
  else if(d.type==="anatomy")el.innerHTML=renderAnatomy(prog);
  else if(d.type==="ladder")el.innerHTML=renderLadder(prog);
  else if(d.type==="grid4")el.innerHTML=renderGrid4([["⚡","Short-term","current turn"],["📚","Long-term","history & facts"],["🎬","Episodic","past sessions"],["🌐","Consensus","shared agents"]],prog);
  else if(d.type==="grid4gov")el.innerHTML=renderGrid4([["📜","Activity logs","transparent actions"],["✋","HITL","human approval"],["⏹️","Interrupt","graceful stop"],["🆔","Agent IDs","traceability"]],prog);
  else if(d.type==="split2")el.innerHTML=renderSplit2(prog);
  else if(d.type==="surface")el.innerHTML=renderSurface(prog);
  else if(d.type==="usecases")el.innerHTML=renderUsecases(prog);
  else if(d.type==="frameworks")el.innerHTML=renderFrameworks(prog);
  else if(d.type==="cycle")el.innerHTML=renderCycle(prog);
  else el.innerHTML=flow(d.nodes,prog);
}
const p=new URLSearchParams(location.search);
render(p.get("diagram")||"agent-definition",parseFloat(p.get("frame")||"1"));
window.__READY=true;
</script>
</body>
</html>
