<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hermes Masterclass — Diagrams</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0b1020;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif}
    #capture{width:1100px;padding:32px 36px;background:linear-gradient(165deg,#0b1020,#1a2444 50%,#0b1020);border-radius:20px;border:1px solid rgba(129,140,248,.2)}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#818cf8;margin-bottom:8px}
    h1{font-size:24px;font-weight:800;color:#f8fafc;margin-bottom:20px} h1 span{color:#6ee7b7}
    .row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
    .node{opacity:.15;transform:translateY(8px);min-width:120px;padding:14px 16px;border-radius:12px;background:rgba(15,23,42,.8);border:1px solid rgba(51,65,85,.8);text-align:center}
    .node.visible{opacity:1;transform:none}.node.active{border-color:#6ee7b7;box-shadow:0 0 20px rgba(110,231,183,.12)}
    .node h2{font-size:12px;color:#f1f5f9;margin-bottom:4px}.node p{font-size:10px;color:#94a3b8;line-height:1.4}
    .arrow{color:#475569;font-size:20px;opacity:.2}.arrow.visible{opacity:1;color:#6ee7b7}
    .stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px;margin:0 auto}
    .tier{opacity:.15;transform:translateX(-8px);padding:12px 16px;border-radius:10px;border:1px solid rgba(51,65,85,.7);background:rgba(15,23,42,.7)}
    .tier.visible{opacity:1;transform:none}.tier.active{border-color:#6ee7b7}
    .tier strong{color:#a5b4fc;font-size:12px;display:block;margin-bottom:4px}.tier span{font-size:11px;color:#94a3b8}
    .tree{font-family:"JetBrains Mono",monospace;font-size:11px;color:#cbd5e1;line-height:1.7;opacity:.15}
    .tree.visible{opacity:1}
    .tree .hl{color:#6ee7b7}
  </style>
</head>
<body>
  <div id="capture"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><div id="content"></div></div>
  <script>
    const D = {
      "learning-loop": { eyebrow:"Hermes", title:'Self-improving <span>loop</span>',
        nodes:["Experience","skill_manage","SKILL.md","Curator","GEPA PR"] },
      "react-loop": { eyebrow:"Runtime", title:'ReAct <span>core loop</span>',
        nodes:["Build prompt","Compress?","LLM call","Tool exec","Loop (≤90 turns)"] },
      "memory-tiers": { eyebrow:"Memory", title:'Three <span>tiers</span>', type:"stack",
        tiers:[["Tier 1","MEMORY.md + USER.md · frozen snapshot · ~80% consolidate"],["Tier 2","state.db SQLite FTS5 · search on demand"],["Tier 3","8 external plugins · prefetch + sync"]] },
      "skill-levels": { eyebrow:"Skills", title:'Progressive <span>disclosure</span>',
        nodes:["L0 catalog","L1 SKILL.md","L2 references/"] },
      "gepa-pipeline": { eyebrow:"GEPA offline", title:'Evolution <span>pipeline</span>',
        nodes:["Read skill","Eval dataset","Trace analysis","Variants","Rubrics","PR"] },
      "hermes-home": { eyebrow:"~/.hermes", title:'Home <span>layout</span>', type:"tree" },
      "cron-flow": { eyebrow:"Cron", title:'Scheduler <span>flow</span>',
        nodes:["Gateway 60s tick","Due job","Isolated session","Telegram deliver"] },
      "profile-builder": { eyebrow:"Dashboard :9119", title:'Profile <span>Builder</span>',
        nodes:["Identity","Model","Built-in skills","Skills Hub","MCP servers"] },
      "profile-anatomy": { eyebrow:"Profile unit", title:'profiles/name/', type:"tree",
        lines:["~/.hermes/profiles/researcher/","├── config.yaml · .env","├── SOUL.md","├── skills/ · memory/","└── sessions/ · state.db"] },
      "curator-phases": { eyebrow:"Curator", title:'Skill <span>maintenance</span>', type:"stack",
        tiers:[["Auto","30d unused → stale · 90d → archived"],["LLM review","Up to 8 passes: keep / patch / consolidate"],["Safety","Hub + bundled untouched · tar.gz snapshot"]] },
    };
    function flow(nodes, prog) {
      const total = nodes.length * 2 - 1; const vis = Math.ceil(prog * total);
      let html = '<div class="row">', idx = 0;
      nodes.forEach((n,i) => {
        html += `<div class="node${idx<vis?" visible":""}${idx===vis-1?" active":""}"><h2>${n}</h2></div>`; idx++;
        if (i < nodes.length-1) { html += `<span class="arrow${idx<vis?" visible":""}">→</span>`; idx++; }
      });
      return html + '</div>';
    }
    function render(id, prog) {
      const d = D[id]; if (!d) return;
      document.getElementById("eyebrow").textContent = d.eyebrow;
      document.getElementById("title").innerHTML = d.title;
      const el = document.getElementById("content");
      if (d.type === "stack") {
        const vis = Math.ceil(prog * d.tiers.length);
        el.innerHTML = '<div class="stack">' + d.tiers.map((t,i)=>
          `<div class="tier${i<vis?" visible":""}${i===vis-1?" active":""}"><strong>${t[0]}</strong><span>${t[1]}</span></div>`).join('') + '</div>';
      } else if (d.type === "tree") {
        const lines = ["~/.hermes/","├── config.yaml · .env · SOUL.md","├── memories/ → MEMORY.md USER.md",
          "├── skills/ · sessions/ · state.db","└── cron/ · plugins/ · logs/"];
        const vis = Math.ceil(prog * lines.length);
        el.innerHTML = '<div class="tree visible">' + lines.slice(0,vis).map((l,i)=>
          `<div class="${i===0?"hl":""}">${l}</div>`).join('') + '</div>';
      } else el.innerHTML = flow(d.nodes, prog);
    }
    const p = new URLSearchParams(location.search);
    render(p.get("diagram")||"learning-loop", parseFloat(p.get("frame")||"1"));
    window.__READY = true;
  </script>
</body>
</html>
