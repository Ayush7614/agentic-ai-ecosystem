<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hermes Masterclass — Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #1e293b 0%, #0f172a 55%, #020617 100%);
      font-family: "JetBrains Mono", Menlo, monospace; }
    #capture { width: 920px; padding: 28px; }
    .terminal { border-radius: 12px; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,.55);
      background: #1e1e24; border: 1px solid rgba(255,255,255,.06); }
    .titlebar { height: 44px; background: linear-gradient(180deg, #2d2d35, #25252c);
      display: flex; align-items: center; padding: 0 16px; gap: 8px; border-bottom: 1px solid rgba(0,0,0,.35); }
    .dot { width: 13px; height: 13px; border-radius: 50%; }
    .dot.red { background: #ff5f57; } .dot.yellow { background: #febc2e; } .dot.green { background: #28c840; }
    .titlebar-label { flex: 1; text-align: center; font-size: 12px; color: #8a8a90; margin-right: 52px; }
    .body { min-height: 340px; padding: 28px 32px 36px; background: #18181c; font-size: 14px; line-height: 1.72; color: #d4d4d8; }
    .line { white-space: pre-wrap; word-break: break-all; }
    .prompt-user { color: #6fdc8c; font-weight: 500; }
    .prompt-path { color: #5eb3ff; }
    .prompt-arrow { color: #e06cff; margin: 0 6px 0 2px; }
    .cmd { color: #f0f0f4; } .dim { color: #8b8b95; } .success { color: #6fdc8c; } .info { color: #5eb3ff; }
  </style>
</head>
<body>
  <div id="capture"><div class="terminal">
    <div class="titlebar"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      <span class="titlebar-label">Terminal — Hermes Agent Masterclass</span></div>
    <div class="body" id="terminal-body"></div>
  </div></div>
  <script>
    const STEPS = {
      "01-install-setup": { user: "techlatest", path: "~", lines: [
        { type: "cmd", text: "curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash" },
        { type: "success", text: "Hermes installed → ~/.hermes/" },
        { type: "cmd", text: "hermes setup" },
        { type: "info", text: "Provider · API key · model · tools" },
        { type: "cmd", text: "hermes" },
        { type: "success", text: "Session started · SOUL.md slot #1 loaded" },
      ]},
      "02-gateway-telegram": { user: "techlatest", path: "~", lines: [
        { type: "cmd", text: "hermes gateway setup" },
        { type: "info", text: "Bot token from @BotFather · user ID from @userinfobot" },
        { type: "success", text: "Gateway running · Telegram connected" },
        { type: "dim", text: "# Message your bot from phone → same agent as CLI" },
      ]},
      "03-profiles-create": { user: "techlatest", path: "~", lines: [
        { type: "cmd", text: "hermes profile create designer --clone" },
        { type: "cmd", text: "hermes profile create programmer --clone" },
        { type: "cmd", text: "hermes profile create researcher --clone" },
        { type: "cmd", text: "hermes profile list" },
        { type: "success", text: "designer · programmer · researcher (isolated)" },
      ]},
      "04-claude-code": { user: "techlatest", path: "~", lines: [
        { type: "cmd", text: "which claude" },
        { type: "success", text: "/usr/local/bin/claude" },
        { type: "cmd", text: "programmer chat" },
        { type: "info", text: "Paste activation prompt → installs claude-code skill" },
        { type: "success", text: "Coding tasks route through Claude Code (Max sub)" },
      ]},
      "05-cron-list": { user: "techlatest", path: "~", lines: [
        { type: "cmd", text: "hermes -p researcher cron list" },
        { type: "out", text: "ID    SCHEDULE              NEXT RUN" },
        { type: "out", text: "digest  weekdays 8am IST     Mon 08:00" },
        { type: "success", text: "Deliver → Telegram · gateway tick 60s" },
      ]},
      "06-install-web": { user: "techlatest", path: "~", lines: [
        { type: "cmd", text: "pip install 'hermes-agent[web]'" },
        { type: "success", text: "Dashboard extra installed" },
        { type: "cmd", text: "hermes dashboard --help" },
        { type: "dim", text: "# Profile Builder lives in local web UI" },
      ]},
      "07-dashboard": { user: "techlatest", path: "~", lines: [
        { type: "cmd", text: "hermes dashboard" },
        { type: "success", text: "→ http://127.0.0.1:9119 · loopback only" },
        { type: "info", text: "Profile Builder → identity · model · skills · MCP" },
      ]},
      "08-researcher-profile": { user: "techlatest", path: "~", lines: [
        { type: "cmd", text: 'hermes profile create researcher \\' },
        { type: "cmd", text: '  --description "Reads docs, writes findings."' },
        { type: "cmd", text: "researcher setup" },
        { type: "cmd", text: "researcher config set model anthropic/claude-sonnet-4" },
        { type: "success", text: "~/.hermes/profiles/researcher/ ready" },
      ]},
      "09-mcp-skills": { user: "techlatest", path: "~", lines: [
        { type: "cmd", text: "researcher skills install openai/skills/k8s" },
        { type: "info", text: "MCP: filesystem via config.yaml mcp_servers map" },
        { type: "success", text: "Skills + MCP → next session or gateway restart" },
      ]},
      "10-researcher-chat": { user: "techlatest", path: "~", lines: [
        { type: "cmd", text: "researcher chat" },
        { type: "success", text: "Isolated memory · skills · MCP from profile" },
        { type: "dim", text: "# GUI path writes same files as CLI above" },
      ]},
    };
    function prompt(u,p){return `<span class="prompt-user">${u}</span><span class="prompt-path"> (${p})</span><span class="prompt-arrow">⇒</span>`;}
    function renderStep(id, progress) {
      const step = STEPS[id]; if (!step) return;
      const total = step.lines.length;
      const n = progress === undefined ? total : Math.min(total, Math.ceil(progress * total));
      let html = "";
      for (let i = 0; i < n; i++) {
        const l = step.lines[i];
        if (l.type === "cmd") html += `<div class="line">${prompt(step.user, step.path)}<span class="cmd">${l.text}</span></div>`;
        else html += `<div class="line ${l.type}">${l.text}</div>`;
      }
      document.getElementById("terminal-body").innerHTML = html;
    }
    const p = new URLSearchParams(location.search);
    const frame = p.get("frame");
    renderStep(p.get("step") || "01-install-setup", frame !== null ? parseFloat(frame) : undefined);
    window.__READY = true;
  </script>
</body>
</html>
