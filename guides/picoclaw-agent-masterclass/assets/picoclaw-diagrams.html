<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a120a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif}
#capture{width:1100px;padding:32px 36px;background:linear-gradient(165deg,#0a120a,#142814 50%,#0a120a);border-radius:20px;border:1px solid rgba(74,222,128,.25)}
.ey{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#4ade80;margin-bottom:8px}
h1{font-size:24px;font-weight:800;color:#f0fdf4;margin-bottom:20px} h1 span{color:#86efac}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.node{opacity:.15;transform:translateY(8px);min-width:110px;padding:14px 16px;border-radius:12px;background:rgba(15,30,15,.85);border:1px solid rgba(51,80,51,.8);text-align:center}
.node.visible{opacity:1;transform:none}.node.active{border-color:#4ade80;box-shadow:0 0 20px rgba(74,222,128,.15)}
.node h2{font-size:12px;color:#f0fdf4;margin-bottom:4px}.node p{font-size:10px;color:#86efac;line-height:1.4}
.arrow{color:#365314;font-size:20px;opacity:.2}.arrow.visible{opacity:1;color:#4ade80}
.stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:560px;margin:0 auto}
.tier{opacity:.15;transform:translateX(-8px);padding:12px 16px;border-radius:10px;border:1px solid rgba(51,80,51,.7);background:rgba(15,30,15,.8);font-family:"JetBrains Mono",monospace;font-size:11px;color:#bbf7d0}
.tier.visible{opacity:1;transform:none}.tier.active{border-color:#4ade80}
.tier strong{color:#86efac;display:block;margin-bottom:4px;font-size:12px;font-family:Inter,sans-serif}
</style>
</head>
<body>
<div id="capture"><div class="ey" id="ey"></div><h1 id="title"></h1><div id="content"></div></div>
<script>
const D={
"picoclaw-stack":{ey:"PicoClaw · Go",title:'Edge <span>harness</span>',nodes:["picoclaw-launcher","Gateway :18790","Agent loop","model_list","tools · MCP"]},
"workspace-anatomy":{ey:"~/.picoclaw/workspace",title:'Harness <span>files</span>',type:"stack",
tiers:[["AGENTS.md · SOUL.md","Behavior + identity"],["sessions/ · memory/","History + MEMORY.md"],["skills/ · cron/","Extensions + jobs"],["HEARTBEAT.md","Periodic tasks"]]},
"channels-map":{ey:"19+ channels",title:'Multi-<span>channel</span>',nodes:["Telegram","Discord","Slack","WhatsApp","QQ · WeCom"]},
"edge-hardware":{ey:"$10 hardware",title:'Deploy <span>anywhere</span>',nodes:["RISC-V Lichee","RPi Zero","Android APK","MaixCAM","x86 desktop"]},
};
function flow(nodes,prog){const total=nodes.length*2-1;const vis=Math.ceil(prog*total);let html='<div class="row">',idx=0;
nodes.forEach((n,i)=>{html+=`<div class="node${idx<vis?" visible":""}${idx===vis-1?" active":""}"><h2>${n}</h2></div>`;idx++;
if(i<nodes.length-1){html+=`<span class="arrow${idx<vis?" visible":""}">→</span>`;idx++;}});return html+'</div>';}
function render(id,prog){const d=D[id];if(!d)return;document.getElementById("ey").textContent=d.ey;
document.getElementById("title").innerHTML=d.title;const el=document.getElementById("content");
if(d.type==="stack"){const vis=Math.ceil(prog*d.tiers.length);el.innerHTML='<div class="stack">'+d.tiers.map((t,i)=>
`<div class="tier${i<vis?" visible":""}${i===vis-1?" active":""}"><strong>${t[0]}</strong>${t[1]}</div>`).join('')+'</div>';}
else el.innerHTML=flow(d.nodes,prog);}
const p=new URLSearchParams(location.search);render(p.get("diagram")||"picoclaw-stack",parseFloat(p.get("frame")||"1"));
window.__READY=true;
</script>
</body>
</html>
