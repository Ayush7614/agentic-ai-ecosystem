<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1a2e1a,#0f172a 55%,#020617);font-family:"JetBrains Mono",Menlo,monospace}
#capture{width:920px;padding:28px}
.terminal{border-radius:12px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55);background:#1e1e24;border:1px solid rgba(255,140,80,.12)}
.titlebar{height:44px;background:linear-gradient(180deg,#2d2d35,#25252c);display:flex;align-items:center;padding:0 16px;gap:8px;border-bottom:1px solid rgba(0,0,0,.35)}
.dot{width:13px;height:13px;border-radius:50%}.dot.red{background:#ff5f57}.dot.yellow{background:#febc2e}.dot.green{background:#28c840}
.titlebar-label{flex:1;text-align:center;font-size:12px;color:#8a8a90;margin-right:52px}
.body{min-height:380px;padding:28px 32px 36px;background:#18181c;font-size:13px;line-height:1.72;color:#d4d4d8}
.line{white-space:pre-wrap;word-break:break-word;margin-bottom:2px}
.prompt-user{color:#ff9f6b}.prompt-path{color:#5eb3ff}.prompt-arrow{color:#e06cff;margin:0 6px}
.cmd{color:#f0f0f4}.dim{color:#8b8b95}.success{color:#6fdc8c}.info{color:#5eb3ff}.tool{color:#c4b5fd}.head{color:#fbbf24;font-weight:500}
</style>
</head>
<body>
<div id="capture"><div class="terminal">
<div class="titlebar"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
<span class="titlebar-label">Terminal — minicpm-v-mcp-server</span></div>
<div class="body" id="body"></div></div></div>
<script>
const STEPS={
"demo":{lines:[
  {t:"cmd",x:"cd guides/minicpm-v-mcp-server && ollama pull minicpm-v4.6"},
  {t:"success",x:"✓ 1.6 GB · text + image · 256K context"},
  {t:"cmd",x:"python examples/generate_fixtures.py && python examples/agent_demo.py"},
  {t:"tool",x:"[Tool: describe_image]  fixtures/diagram_v2.png"},
  {t:"head",x:"## Architecture summary"},
  {t:"info",x:"LitServe → CrewAI → Qdrant agentic pipeline"},
  {t:"tool",x:"[Tool: ocr_document]  fixtures/sample_receipt.png"},
  {t:"head",x:"## Receipt OCR"},
  {t:"success",x:"✅ TOTAL $10.75 · Card ****4242 · 2026-06-23"},
  {t:"tool",x:"[Tool: compare_images]  diagram_v1 → diagram_v2"},
  {t:"head",x:"## Visual diff"},
  {t:"success",x:"✅ Added CrewAI + LitServe · v1 was sync-only"},
  {t:"dim",x:"# Wire examples/server.py → Cursor MCP settings"},
]},
"ollama":{lines:[
  {t:"cmd",x:"ollama run minicpm-v4.6"},
  {t:"info",x:">>> Describe this image"},
  {t:"cmd",x:"/path/to/screenshot.png"},
  {t:"success",x:"MiniCPM-V 4.6 · 1.3B params · vision + text"},
  {t:"dim",x:"# Same model, exposed as MCP tools in Cursor"},
]},
};
function prompt(){return `<span class="prompt-user">(venv) ayush@Mac-mini</span><span class="prompt-path"> minicpm-v-mcp</span><span class="prompt-arrow">%</span> `;}
function render(id,prog){
  const s=STEPS[id];if(!s)return;
  const n=Math.min(s.lines.length,Math.ceil((prog??1)*s.lines.length));
  let h='';
  for(let i=0;i<n;i++){
    const l=s.lines[i];
    if(l.t==='cmd')h+=`<div class="line">${prompt()}<span class="cmd">${l.x}</span></div>`;
    else h+=`<div class="line ${l.t}">${l.x}</div>`;
  }
  document.getElementById('body').innerHTML=h;
}
const q=new URLSearchParams(location.search);
render(q.get('step')||'demo',q.get('frame')!==null?parseFloat(q.get('frame')):undefined);
window.__READY=true;
</script>
</body>
</html>
