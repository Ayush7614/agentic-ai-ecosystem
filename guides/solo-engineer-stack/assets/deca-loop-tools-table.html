<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deca-Loop — 10 tools</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1419;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; font-family: Inter, system-ui, sans-serif;
    }
    #capture {
      width: 1040px;
      background: linear-gradient(165deg, #0b1020 0%, #172042 50%, #0b1020 100%);
      border-radius: 20px; padding: 28px 32px 32px;
      border: 1px solid rgba(129, 140, 248, 0.18);
      box-shadow: 0 24px 80px rgba(0,0,0,0.55);
    }
    .header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 16px;
    }
    h1 { font-size: 24px; font-weight: 800; color: #f8fafc; letter-spacing: -0.03em; }
    h1 span { color: #818cf8; }
    .badge {
      font-size: 11px; font-weight: 600; color: #94a3b8;
      background: rgba(15,23,42,0.85); border: 1px solid rgba(110,231,183,0.35);
      border-radius: 10px; padding: 8px 14px; text-align: right;
    }
    .badge strong { color: #6ee7b7; display: block; font-size: 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead th {
      text-align: left; padding: 8px 10px;
      color: #64748b; font-weight: 700; font-size: 10px;
      letter-spacing: 0.06em; text-transform: uppercase;
      border-bottom: 2px solid #334155;
    }
    thead th.num { width: 36px; text-align: center; }
    tbody tr { opacity: 0.12; transform: translateY(4px); }
    tbody tr.visible { opacity: 1; transform: translateY(0); }
    tbody tr.active { background: rgba(129, 140, 248, 0.1); }
    tbody tr.active td.num { color: #6ee7b7; }
    td { padding: 7px 10px; color: #cbd5e1; border-bottom: 1px solid rgba(51,65,85,0.55); vertical-align: top; }
    td.num {
      font-family: "JetBrains Mono", monospace; font-weight: 700;
      color: #818cf8; text-align: center; font-size: 13px;
    }
    td.tool { color: #f1f5f9; font-weight: 700; white-space: nowrap; }
    td.role { color: #94a3b8; font-size: 11px; }
    td.artifact {
      font-family: "JetBrains Mono", monospace; font-size: 10.5px;
      color: #a5b4fc; line-height: 1.4;
    }
    .footer { margin-top: 12px; font-size: 10px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div id="capture">
    <div class="header">
      <h1>Deca-Loop · <span>10 equal tools</span></h1>
      <div class="badge"><strong>1</strong> founder + 10 repos</div>
    </div>
    <table>
      <thead>
        <tr><th class="num">#</th><th>Tool</th><th>Role</th><th>Artifact</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="footer">PulseFeedback · CSAT ≤ 2 loops back to Task Master</div>
  </div>
  <script>
    const DATA = [
      [1, "Task Master", "PM", "tasks.json"],
      [2, "CrewAI", "Tech lead", "brief.md · spec.md · test-plan.md"],
      [3, "LangGraph", "Architect", "state-approved.json"],
      [4, "OpenHands", "Junior dev", "pulsefeedback/ scaffold"],
      [5, "Aider", "Mid-level dev", "API routes + git commits"],
      [6, "Cline", "IDE teammate", "frontend/ dashboard UI"],
      [7, "n8n", "Ops", "csat-loop.json workflows"],
      [8, "Coolify", "DevOps", "Dockerfile · HTTPS URL"],
      [9, "PostHog", "QA + data", "/api/events funnel"],
      [10, "Chatwoot", "Support", "CSAT → new-task.json"],
    ];

    const progress = parseFloat(new URLSearchParams(location.search).get("frame") || "1");
    const total = DATA.length;
    const visible = Math.min(total, Math.max(0, Math.ceil(progress * total)));
    const activeIdx = Math.min(total - 1, Math.max(0, visible - 1));

    const tbody = document.getElementById("rows");
    DATA.forEach(([num, tool, role, artifact], i) => {
      const tr = document.createElement("tr");
      if (i < visible) tr.classList.add("visible");
      if (i === activeIdx && visible > 0) tr.classList.add("active");
      tr.innerHTML = `
        <td class="num">${num}</td>
        <td class="tool">${tool}</td>
        <td class="role">${role}</td>
        <td class="artifact">${artifact}</td>`;
      tbody.appendChild(tr);
    });
    window.__READY = true;
  </script>
</body>
</html>
