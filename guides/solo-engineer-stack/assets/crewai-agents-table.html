<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CrewAI — 3 agents · 3 artifacts</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1419;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; font-family: Inter, system-ui, sans-serif;
    }
    #capture {
      width: 880px;
      background: linear-gradient(165deg, #0b1020 0%, #1a2444 45%, #0b1020 100%);
      border-radius: 20px; padding: 32px 36px 36px;
      border: 1px solid rgba(129, 140, 248, 0.2);
      box-shadow: 0 24px 80px rgba(0,0,0,0.55);
    }
    .header { margin-bottom: 22px; }
    .eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: #818cf8; margin-bottom: 8px;
    }
    h1 { font-size: 26px; font-weight: 800; color: #f8fafc; letter-spacing: -0.03em; }
    h1 span { color: #6ee7b7; }
    .sub { margin-top: 8px; font-size: 13px; color: #94a3b8; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    thead th {
      text-align: left; padding: 10px 14px;
      color: #64748b; font-weight: 700; font-size: 10px;
      letter-spacing: 0.08em; text-transform: uppercase;
      border-bottom: 2px solid #334155;
    }
    tbody tr { opacity: 0.12; transform: translateY(6px); }
    tbody tr.visible { opacity: 1; transform: translateY(0); }
    tbody tr.active { background: rgba(110, 231, 183, 0.1); }
    tbody tr.active td:first-child { box-shadow: inset 4px 0 0 #6ee7b7; }
    td { padding: 16px 14px; border-bottom: 1px solid rgba(51,65,85,0.55); vertical-align: middle; }
    td.file {
      font-family: "JetBrains Mono", monospace;
      font-size: 14px; font-weight: 600; color: #e2e8f0;
    }
    td.file code {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(129, 140, 248, 0.35);
      border-radius: 8px; padding: 6px 12px; color: #a5b4fc;
    }
    td.role { font-size: 15px; font-weight: 700; color: #f1f5f9; }
    td.desc { font-size: 12px; color: #94a3b8; line-height: 1.45; max-width: 280px; }
    .pill {
      display: inline-block; font-size: 10px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: #6ee7b7; background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(110, 231, 183, 0.35);
      border-radius: 999px; padding: 4px 10px; margin-top: 6px;
    }
    .footer {
      margin-top: 18px; font-size: 11px; color: #64748b; text-align: center;
    }
  </style>
</head>
<body>
  <div id="capture">
    <div class="header">
      <div class="eyebrow">Part 2 · CrewAI</div>
      <h1>Three agents · <span>three artifacts</span></h1>
      <p class="sub">Equal weight — each agent ships one markdown file before handoff to LangGraph.</p>
    </div>
    <table>
      <thead>
        <tr><th>File</th><th>Agent role</th><th>Output</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="footer">PulseFeedback · Solo Engineer Stack · artifacts/02-crewai/</div>
  </div>
  <script>
    const DATA = [
      ["brief.md", "Market Researcher", "Competitors, positioning, target user", "Research"],
      ["spec.md", "Technical Architect", "API routes, schema, stack decisions", "Architecture"],
      ["test-plan.md", "QA Lead", "Acceptance tests for all 10 stack tools", "Quality"],
    ];

    const progress = parseFloat(new URLSearchParams(location.search).get("frame") || "1");
    const total = DATA.length;
    const visible = Math.min(total, Math.max(0, Math.ceil(progress * total)));
    const activeIdx = Math.min(total - 1, Math.max(0, visible - 1));

    const tbody = document.getElementById("rows");
    DATA.forEach(([file, role, desc, tag], i) => {
      const tr = document.createElement("tr");
      if (i < visible) tr.classList.add("visible");
      if (i === activeIdx && visible > 0) tr.classList.add("active");
      tr.innerHTML = `
        <td class="file"><code>${file}</code></td>
        <td class="role">${role}<div class="pill">${tag}</div></td>
        <td class="desc">${desc}</td>`;
      tbody.appendChild(tr);
    });
    window.__READY = true;
  </script>
</body>
</html>
