<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:600px;overflow:hidden;font-family:"JetBrains Mono",Menlo,monospace}
body{display:flex;align-items:center;justify-content:center;background:#0a0a0f}
#capture{width:1120px;height:520px;border-radius:16px;overflow:hidden;box-shadow:0 32px 90px rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.08)}
.bar{height:48px;background:linear-gradient(180deg,#2a2a32,#222228);display:flex;align-items:center;padding:0 18px;gap:9px;border-bottom:1px solid #111}
.dot{width:14px;height:14px;border-radius:50%}.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.lbl{flex:1;text-align:center;font-size:13px;color:#888;margin-right:56px}
.body{padding:32px 36px;background:#141418;font-size:16px;line-height:1.8;color:#d4d4d8;min-height:472px}
.pu{color:#fb923c;font-weight:600}.pp{color:#38bdf8}.pa{color:#c084fc;margin:0 8px}
.cmd{color:#f4f4f5}.ok{color:#4ade80}.warn{color:#fbbf24}.dim{color:#71717a}.info{color:#67e8f9}
</style>
</head>
<body>
<div id="capture"><div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="lbl">harness-session — zsh</span></div><div class="body" id="b"></div></div>
<script>
const S={
  "01-drop-templates":{u:"ayushkumar",p:"~/my-app",lines:[
    {t:"c",x:"cp examples/{AGENTS.md,init.sh,feature_list.json} ."},
    {t:"ok",x:"4 harness files installed"},
    {t:"c",x:"chmod +x init.sh"},
    {t:"info",x:"Repo now has operating manual + scope + bootstrap"},
  ]},
  "02-init-session":{u:"ayushkumar",p:"~/my-app",lines:[
    {t:"c",x:"./init.sh"},
    {t:"dim",x:"==> install · health check · harness state"},
    {t:"ok",x:"OK — environment ready"},
    {t:"c",x:"cat claude-progress.md | head -5"},
    {t:"info",x:"Last session: F03 indexer stub — pick up here"},
  ]},
  "03-verify-gate":{u:"ayushkumar",p:"~/my-app",lines:[
    {t:"c",x:"npm test && npm run lint && npm run typecheck"},
    {t:"warn",x:"FAIL lint: unused import in indexer.ts"},
    {t:"c",x:"# agent fixes · re-runs gate"},
    {t:"ok",x:"All green — evidence recorded in feature_list.json"},
  ]},
  "04-handoff":{u:"ayushkumar",p:"~/my-app",lines:[
    {t:"c",x:"git add claude-progress.md feature_list.json src/"},
    {t:"c",x:'git commit -m "F03: indexer passes verify gate"'},
    {t:"ok",x:"Clean handoff — next session reads progress.md"},
    {t:"dim",x:"# harness governed: no done without proof"},
  ]},
};
function pr(u,p){return `<span class="pu">(base) ${u}@Ayushs-Mac-mini</span><span class="pp"> ${p}</span><span class="pa">%</span>`;}
function render(id,prog){
  const s=S[id];if(!s)return;
  const vis=Math.ceil(prog*s.lines.length);
  document.getElementById("b").innerHTML=s.lines.slice(0,vis).map(L=>{
    if(L.t==="c")return `<div>${pr(s.u,s.p)}<span class="cmd">${L.x}</span></div>`;
    return `<div class="${L.t}">${L.x}</div>`;
  }).join("");
}
const q=new URLSearchParams(location.search);
render(q.get("step")||"01-drop-templates",parseFloat(q.get("frame")||"1"));
window.__READY=true;
</script>
</body>
</html>
