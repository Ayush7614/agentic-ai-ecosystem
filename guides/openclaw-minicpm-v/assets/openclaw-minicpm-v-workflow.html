<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f6fb;font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:16px}
#capture{width:1100px;background:linear-gradient(180deg,#fafbff,#e0f2fe);border-radius:24px;padding:36px 40px;box-shadow:0 20px 60px rgba(30,41,82,.12)}
h1{font-size:30px;font-weight:800;margin-bottom:24px}
h1 .a{color:#0891b2}h1 .b{color:#7c3aed}h1 .c{color:#059669}
.row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.node{min-width:140px;padding:16px;border-radius:14px;text-align:center;border:2px solid #bae6fd;background:#fff;opacity:.15;transform:translateY(8px);transition:all .25s}
.node.on{opacity:1;transform:none}
.node.hot{box-shadow:0 0 0 3px rgba(8,145,178,.35)}
.node .ic{font-size:28px}.node .t{font-weight:700;margin-top:6px;font-size:14px}
.arrow{font-size:24px;color:#94a3b8;opacity:.2;transition:opacity .25s}.arrow.on{opacity:1}
</style>
</head>
<body>
<div id="capture"><h1><span class="a">Photo</span> → <span class="b">OpenClaw</span> → <span class="c">MiniCPM-V</span></h1>
<div class="row" id="row"></div></div>
<script>
const N=[
  {ic:"📱",t:"Telegram / WhatsApp",id:"n0"},
  {ic:"→",t:"",id:"a0",arrow:true},
  {ic:"🦞",t:"OpenClaw Gateway",id:"n1"},
  {ic:"→",t:"",id:"a1",arrow:true},
  {ic:"📷",t:"vision-photo skill",id:"n2"},
  {ic:"→",t:"",id:"a2",arrow:true},
  {ic:"⚡",t:"LitServe :8002",id:"n3"},
  {ic:"→",t:"",id:"a3",arrow:true},
  {ic:"👁",t:"MiniCPM-V 4.6",id:"n4"},
];
const row=document.getElementById('row');
N.forEach(x=>{
  if(x.arrow){row.innerHTML+=`<span class="arrow" id="${x.id}">→</span>`;}
  else row.innerHTML+=`<div class="node" id="${x.id}"><div class="ic">${x.ic}</div><div class="t">${x.t}</div></div>`;
});
const p=parseFloat(new URLSearchParams(location.search).get('frame')||'1');
['n0','a0','n1','a1','n2','a2','n3','a3','n4'].forEach((id,i)=>{
  if(p>=(i+1)/9){const el=document.getElementById(id);el?.classList.add('on');if(id.startsWith('n'))el?.classList.add('hot');}
});
window.__READY=true;
</script>
</body>
</html>
