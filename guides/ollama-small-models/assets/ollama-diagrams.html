<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d12;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif}
#capture{width:1100px;padding:32px 36px;background:linear-gradient(165deg,#0d0d12,#1a1a24 50%,#0d0d12);border-radius:20px;border:1px solid rgba(255,255,255,.12)}
.ey{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a78bfa;margin-bottom:8px}
h1{font-size:24px;font-weight:800;color:#fafafa;margin-bottom:20px} h1 span{color:#fff}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.node{opacity:.15;transform:translateY(8px);min-width:100px;padding:14px 14px;border-radius:12px;background:rgba(26,26,36,.9);border:1px solid rgba(80,80,100,.6);text-align:center}
.node.visible{opacity:1;transform:none}.node.active{border-color:#fff;box-shadow:0 0 20px rgba(255,255,255,.08)}
.node h2{font-size:11px;color:#fafafa;margin-bottom:4px}.node p{font-size:9px;color:#a1a1aa;line-height:1.4}
.arrow{color:#3f3f46;font-size:20px;opacity:.2}.arrow.visible{opacity:1;color:#fff}
.stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:580px;margin:0 auto}
.tier{opacity:.15;transform:translateX(-8px);padding:12px 16px;border-radius:10px;border:1px solid rgba(80,80,100,.6);background:rgba(26,26,36,.85);font-family:"JetBrains Mono",monospace;font-size:11px;color:#e4e4e7}
.tier.visible{opacity:1;transform:none}.tier.active{border-color:#fff}
.tier strong{color:#fafafa;display:block;margin-bottom:4px;font-size:12px;font-family:Inter,sans-serif}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{opacity:.15;transform:scale(.95);padding:14px;border-radius:12px;border:1px solid rgba(80,80,100,.6);background:rgba(26,26,36,.85);text-align:center}
.card.visible{opacity:1;transform:none}.card.active{border-color:#a78bfa}
.card h2{font-size:12px;color:#fafafa;margin-bottom:6px}.card p{font-size:10px;color:#a1a1aa}
</style>
</head>
<body>
<div id="capture"><div class="ey" id="ey"></div><h1 id="title"></h1><div id="content"></div></div>
<script>
const D={
"ram-tiers":{ey:"RAM budget",title:'8 GB vs <span>16 GB</span>',type:"stack",
tiers:[["8 GB · ultra-light","qwen3.5:0.8b · lfm2.5 · minicpm-v"],["16 GB · balanced","gemma4:e2b · qwen3.5:4b · north-mini-code"],["16 GB · coding max","glm-4.7-flash · qwen3.6:27b"],["Always add","nomic-embed-text for RAG"]]},
"task-picker":{ey:"Pick by job",title:'Task → <span>model</span>',type:"grid",
cards:[["💬 Chat","qwen3.5 · gemma4"],["💻 Code","glm-4.7 · north-mini"],["👁 Vision","minicpm-v · gemma4"],["📚 RAG","nomic-embed"],["🤖 Agents","ornith · qwen3.6"],["🧠 Think","lfm2.5 · deepseek-r1"]]},
"model-families":{ey:"2026 library",title:'Model <span>families</span>',nodes:["Qwen 3.5/3.6","Gemma 4","GLM-4.7","LFM2.5","MiniCPM-V","North Mini"]},
"pull-run-workflow":{ey:"Ollama CLI",title:'pull → run → <span>API</span>',nodes:["ollama pull","local cache","ollama run","stream tokens","/v1/chat"]},
};
function flow(nodes,prog){const total=nodes.length*2-1;const vis=Math.ceil(prog*total);let html='<div class="row">',idx=0;
nodes.forEach((n,i)=>{html+=`<div class="node${idx<vis?" visible":""}${idx===vis-1?" active":""}"><h2>${n}</h2></div>`;idx++;
if(i<nodes.length-1){html+=`<span class="arrow${idx<vis?" visible":""}">→</span>`;idx++;}});return html+'</div>';}
function render(id,prog){const d=D[id];if(!d)return;document.getElementById("ey").textContent=d.ey;
document.getElementById("title").innerHTML=d.title;const el=document.getElementById("content");
if(d.type==="stack"){const vis=Math.ceil(prog*d.tiers.length);el.innerHTML='<div class="stack">'+d.tiers.map((t,i)=>
`<div class="tier${i<vis?" visible":""}${i===vis-1?" active":""}"><strong>${t[0]}</strong>${t[1]}</div>`).join('')+'</div>';}
else if(d.type==="grid"){const vis=Math.ceil(prog*d.cards.length);el.innerHTML='<div class="grid">'+d.cards.map((c,i)=>
`<div class="card${i<vis?" visible":""}${i===vis-1?" active":""}"><h2>${c[0]}</h2><p>${c[1]}</p></div>`).join('')+'</div>';}
else el.innerHTML=flow(d.nodes,prog);}
const p=new URLSearchParams(location.search);render(p.get("diagram")||"ram-tiers",parseFloat(p.get("frame")||"1"));
window.__READY=true;
</script>
</body>
</html>
