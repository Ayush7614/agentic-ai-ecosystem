<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1c0f0a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif}
#capture{width:1100px;padding:32px 36px;background:linear-gradient(165deg,#1c0f0a,#2d1810 50%,#1c0f0a);border-radius:20px;border:1px solid rgba(251,146,60,.25)}
.ey{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fb923c;margin-bottom:8px}
h1{font-size:24px;font-weight:800;color:#fff7ed;margin-bottom:20px} h1 span{color:#fdba74}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.node{opacity:.15;transform:translateY(8px);min-width:110px;padding:14px 16px;border-radius:12px;background:rgba(40,25,15,.85);border:1px solid rgba(120,70,40,.6);text-align:center}
.node.visible{opacity:1;transform:none}.node.active{border-color:#fb923c;box-shadow:0 0 20px rgba(251,146,60,.15)}
.node h2{font-size:12px;color:#fff7ed;margin-bottom:4px}.node p{font-size:10px;color:#d6d3d1;line-height:1.4}
.arrow{color:#78350f;font-size:20px;opacity:.2}.arrow.visible{opacity:1;color:#fb923c}
.stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:560px;margin:0 auto}
.tier{opacity:.15;transform:translateX(-8px);padding:12px 16px;border-radius:10px;border:1px solid rgba(120,70,40,.6);background:rgba(40,25,15,.8)}
.tier.visible{opacity:1;transform:none}.tier.active{border-color:#fb923c}
.tier strong{color:#fdba74;font-size:12px;display:block;margin-bottom:4px}.tier span{font-size:11px;color:#d6d3d1}
</style>
</head>
<body>
<div id="capture"><div class="ey" id="ey"></div><h1 id="title"></h1><div id="content"></div></div>
<script>
const D={
"zeroclaw-stack":{ey:"ZeroClaw 🦀",title:'Agent <span>runtime</span>',nodes:["30+ channels","Gateway · ACP","Agent loop","Security · SOP","Providers · tools"]},
"config-anatomy":{ey:"config.toml",title:'Four <span>sections</span>',nodes:["providers.models","agents.alias","risk.profile","channels.type"]},
"security-layers":{ey:"Security",title:'Supervised <span>autonomy</span>',nodes:["Workspace bounds","Command policy","OS sandbox","Tool receipts","Approval gates"]},
"request-lifecycle":{ey:"Lifecycle",title:'Message <span>path</span>',nodes:["Channel in","Gateway route","Agent loop","Tool exec","Reply out"]},
"memory-gateway":{ey:"Memory",title:'SQLite + <span>dashboard</span>',nodes:["Session store","Embeddings","Gateway UI","Browse · edit","Cross-channel"]},
};
function flow(nodes,prog){const total=nodes.length*2-1;const vis=Math.ceil(prog*total);let html='<div class="row">',idx=0;
nodes.forEach((n,i)=>{html+=`<div class="node${idx<vis?" visible":""}${idx===vis-1?" active":""}"><h2>${n}</h2></div>`;idx++;
if(i<nodes.length-1){html+=`<span class="arrow${idx<vis?" visible":""}">→</span>`;idx++;}});return html+'</div>';}
function render(id,prog){const d=D[id];if(!d)return;document.getElementById("ey").textContent=d.ey;
document.getElementById("title").innerHTML=d.title;document.getElementById("content").innerHTML=flow(d.nodes,prog);}
const p=new URLSearchParams(location.search);render(p.get("diagram")||"zeroclaw-stack",parseFloat(p.get("frame")||"1"));
window.__READY=true;
</script>
</body>
</html>
