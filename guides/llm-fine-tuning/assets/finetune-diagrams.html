<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LLM Fine-Tuning — Diagrams</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0f1a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif}
    #capture{width:1100px;padding:32px 36px;background:linear-gradient(165deg,#0a0f1a,#1a1040 45%,#0a1f2e 80%,#0a0f1a);border-radius:20px;border:1px solid rgba(167,139,250,.22)}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a78bfa;margin-bottom:8px}
    h1{font-size:24px;font-weight:800;color:#f8fafc;margin-bottom:20px} h1 span{color:#34d399}
    .row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
    .node{opacity:.15;transform:translateY(8px);min-width:100px;padding:14px 14px;border-radius:12px;background:rgba(15,23,42,.85);border:1px solid rgba(51,65,85,.8);text-align:center}
    .node.visible{opacity:1;transform:none}.node.active{border-color:#a78bfa;box-shadow:0 0 20px rgba(167,139,250,.15)}
    .node h2{font-size:11px;color:#f1f5f9;line-height:1.35}.node p{font-size:9px;color:#94a3b8;margin-top:4px}
    .arrow{color:#475569;font-size:18px;opacity:.2}.arrow.visible{opacity:1;color:#34d399}
    .stack{display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
    .tier{opacity:.15;transform:translateX(-8px);padding:12px 16px;border-radius:10px;border:1px solid rgba(51,65,85,.7);background:rgba(15,23,42,.75);font-size:12px;color:#cbd5e1}
    .tier.visible{opacity:1;transform:none}.tier.active{border-color:#34d399}
    .tier strong{color:#a78bfa;display:block;margin-bottom:4px;font-size:11px}
    .cols{display:flex;gap:16px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
    .bar-wrap{text-align:center;opacity:.15;transform:translateY(8px)}
    .bar-wrap.visible{opacity:1;transform:none}
    .bar{width:56px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#a78bfa,#6366f1);margin:0 auto 6px}
    .bar-label{font-size:10px;color:#94a3b8;font-weight:600}
    .bar-val{font-size:9px;color:#64748b}
    .lora{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}
    .matrix{padding:16px 20px;border-radius:12px;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;text-align:center;opacity:.15;transform:scale(.95)}
    .matrix.visible{opacity:1;transform:scale(1)}
    .matrix.frozen{background:rgba(51,65,85,.5);border:1px solid #475569;color:#94a3b8}
    .matrix.train{background:rgba(52,211,153,.12);border:1px solid #34d399;color:#6ee7b7}
    .matrix.plus{color:#a78bfa;font-size:24px;opacity:.15}.matrix.plus.visible{opacity:1}
    .op{font-size:28px;color:#a78bfa;opacity:.15}.op.visible{opacity:1}
    .ring{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .pill{opacity:.15;transform:scale(.95);padding:8px 14px;border-radius:999px;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.3);font-size:11px;color:#ddd6fe;font-weight:600}
    .pill.visible{opacity:1;transform:scale(1)}.pill.active{background:rgba(52,211,153,.2);border-color:#34d399;color:#6ee7b7}
  </style>
</head>
<body>
  <div id="capture"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><div id="content"></div></div>
  <script>
    const D = {
      "landscape": { eyebrow:"Adaptation", title:'Fine-tuning <span>landscape</span>',
        nodes:["Base model","Choose family","Train adapter","Eval","Deploy"] },
      "decision-ladder": { eyebrow:"When to train", title:'Adaptation <span>ladder</span>', type:"stack",
        tiers:[["1 · Prompt","System msg · few-shot · schema in prompt"],["2 · RAG","Retrieve domain context at inference"],["3 · Tools","APIs · SQL · calculators"],["4 · Fine-tune","LoRA / QLoRA / SFT when native behavior needed"],["5 · Align","DPO · RLHF · GRPO for preferences"]] },
      "five-families": { eyebrow:"Taxonomy", title:'Five <span>families</span>', type:"pills",
        pills:["A · Full SFT / CPT","B · Soft prompts","C · PEFT LoRA","D · Alignment","E · Federated"] },
      "peft-menu": { eyebrow:"PEFT", title:'Parameter-efficient <span>menu</span>', type:"stack",
        tiers:[["LoRA","Low-rank deltas on attention · default choice"],["QLoRA","4-bit base + bf16 adapters"],["AdaLoRA / DoRA","Adaptive rank · magnitude-direction"],["IA³ / Adapters","Scalers · bottleneck FFN modules"],["Soft prompts","Virtual tokens · tiny storage"]] },
      "lora-math": { eyebrow:"LoRA", title:'W + <span>BA</span>', type:"lora" },
      "quantization-ladder": { eyebrow:"Precision", title:'Memory <span>ladder</span>', type:"bars",
        bars:[["fp32","4 B","100%"],["bf16","2 B","50%"],["int8","1 B","25%"],["int4 NF4","½ B","~12%"]] },
      "qlora-stack": { eyebrow:"QLoRA", title:'4-bit base + <span>16-bit LoRA</span>', type:"stack",
        tiers:[["Forward","Dequantize 4-bit W → bf16 matmul → discard"],["Backward","Gradients → LoRA A,B only"],["Storage","NF4 frozen weights · adapters in bf16"],["Result","7B–70B on single GPU"]] },
      "rlhf-pipeline": { eyebrow:"Alignment", title:'RLHF <span>pipeline</span>',
        nodes:["SFT demos","Preference data","Reward model","PPO + KL","Aligned policy"] },
      "dpo-preference": { eyebrow:"DPO", title:'Direct <span>preferences</span>',
        nodes:["Prompt x","Winner y_w","Loser y_l","Policy π","Ref π_ref"] },
      "grpo-loop": { eyebrow:"GRPO", title:'Group-relative <span>RL</span>',
        nodes:["Prompt","Sample group","Auto score","Rank in group","Policy update"] },
    };
    function flow(nodes, prog) {
      const total = nodes.length * 2 - 1, vis = Math.ceil(prog * total);
      let html = '<div class="row">', idx = 0;
      nodes.forEach((n,i) => {
        html += `<div class="node${idx<vis?" visible":""}${idx===vis-1?" active":""}"><h2>${n}</h2></div>`; idx++;
        if (i < nodes.length-1) { html += `<span class="arrow${idx<vis?" visible":""}">→</span>`; idx++; }
      });
      return html + '</div>';
    }
    function render(id, prog) {
      const d = D[id]; if (!d) return;
      document.getElementById("eyebrow").textContent = d.eyebrow;
      document.getElementById("title").innerHTML = d.title;
      const el = document.getElementById("content");
      if (d.type === "stack") {
        const vis = Math.ceil(prog * d.tiers.length);
        el.innerHTML = '<div class="stack">' + d.tiers.map((t,i)=>
          `<div class="tier${i<vis?" visible":""}${i===vis-1?" active":""}"><strong>${t[0]}</strong>${t[1]}</div>`).join('') + '</div>';
      } else if (d.type === "pills") {
        const vis = Math.ceil(prog * d.pills.length);
        el.innerHTML = '<div class="ring">' + d.pills.map((p,i)=>
          `<span class="pill${i<vis?" visible":""}${i===vis-1?" active":""}">${p}</span>`).join('') + '</div>';
      } else if (d.type === "bars") {
        const vis = Math.ceil(prog * d.bars.length);
        const maxH = 120;
        el.innerHTML = '<div class="cols">' + d.bars.map((b,i) => {
          const h = maxH * (d.bars.length - i) / d.bars.length;
          return `<div class="bar-wrap${i<vis?" visible":""}"><div class="bar" style="height:${h}px"></div><div class="bar-label">${b[0]}</div><div class="bar-val">${b[1]} · ${b[2]}</div></div>`;
        }).join('') + '</div>';
      } else if (d.type === "lora") {
        const s = prog;
        el.innerHTML = `<div class="lora">
          <div class="matrix frozen${s>.1?" visible":""}">W<br><span style="font-size:10px;color:#64748b">frozen</span></div>
          <div class="op${s>.35?" visible":""}">+</div>
          <div class="matrix train${s>.55?" visible":""}">B × A<br><span style="font-size:10px">rank r ≪ d</span></div>
          <div class="op${s>.75?" visible":""}">=</div>
          <div class="matrix train${s>.9?" visible":""}">W′<br><span style="font-size:10px">effective</span></div>
        </div>`;
      } else el.innerHTML = flow(d.nodes, prog);
    }
    const p = new URLSearchParams(location.search);
    render(p.get("diagram")||"landscape", parseFloat(p.get("frame")||"1"));
    window.__READY = true;
  </script>
</body>
</html>
