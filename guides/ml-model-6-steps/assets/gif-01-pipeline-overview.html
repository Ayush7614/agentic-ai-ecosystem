<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ML Model Pipeline — 6 Steps Overview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #eef1f8;
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #capture {
      width: 1200px;
      background: linear-gradient(165deg, #faf8ff 0%, #f3eeff 38%, #fff8ed 100%);
      border-radius: 28px;
      padding: 40px 44px 36px;
      box-shadow: 0 24px 64px rgba(76, 29, 149, 0.14);
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 22px;
    }
    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.6px;
      line-height: 1.1;
      color: #1e1b4b;
    }
    h1 em {
      font-style: normal;
      background: linear-gradient(90deg, #6d28d9, #d97706);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      margin-top: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #64748b;
    }
    .pill {
      background: #fff;
      border: 1px solid #e9d5ff;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      color: #5b21b6;
      box-shadow: 0 6px 20px rgba(109, 40, 217, 0.08);
    }
    svg.flow {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Conveyor belt texture scroll */
    @keyframes belt-move {
      from { transform: translateX(0); }
      to { transform: translateX(-40px); }
    }
    .belt-texture {
      animation: belt-move 1.1s linear infinite;
    }

    /* Package riding the belt */
    @keyframes package-ride {
      0% { transform: translate(52px, 0); opacity: 0; }
      4% { opacity: 1; }
      96% { opacity: 1; }
      100% { transform: translate(1048px, 0); opacity: 0; }
    }
    .belt-package {
      animation: package-ride 5.5s linear infinite;
    }

    /* Rollers spin */
    @keyframes roller-spin {
      to { transform: rotate(360deg); }
    }
    .roller {
      transform-origin: center;
      animation: roller-spin 1.4s linear infinite;
    }
    .roller.r2 { animation-delay: -0.35s; }
    .roller.r3 { animation-delay: -0.7s; }
    .roller.r4 { animation-delay: -1.05s; }

    /* Station highlight cycle */
    @keyframes station-pulse {
      0%, 100% { opacity: 0.22; transform: scale(1); }
      8%, 14% { opacity: 1; transform: scale(1.04); }
    }
    .station-glow { transform-origin: center; }
    .station-glow.s1 { animation: station-pulse 5.5s ease-in-out infinite; animation-delay: 0s; }
    .station-glow.s2 { animation: station-pulse 5.5s ease-in-out infinite; animation-delay: 0.92s; }
    .station-glow.s3 { animation: station-pulse 5.5s ease-in-out infinite; animation-delay: 1.84s; }
    .station-glow.s4 { animation: station-pulse 5.5s ease-in-out infinite; animation-delay: 2.76s; }
    .station-glow.s5 { animation: station-pulse 5.5s ease-in-out infinite; animation-delay: 3.68s; }
    .station-glow.s6 { animation: station-pulse 5.5s ease-in-out infinite; animation-delay: 4.6s; }

    @keyframes dot-travel {
      0% { offset-distance: 0%; opacity: 0; }
      5% { opacity: 1; }
      95% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    .flow-dot {
      offset-path: path("M 90 118 L 1090 118");
      animation: dot-travel 5.5s linear infinite;
    }

    @keyframes dash-flow {
      to { stroke-dashoffset: -28; }
    }
    .flow-line {
      stroke-dasharray: 10 8;
      animation: dash-flow 1.1s linear infinite;
    }

    @keyframes feedback-dash {
      to { stroke-dashoffset: -20; }
    }
    .feedback-line {
      stroke-dasharray: 6 6;
      animation: feedback-dash 1.4s linear infinite;
    }

    @keyframes arc-pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }
    .feedback-arc { animation: arc-pulse 2.2s ease-in-out infinite; }

    @keyframes gear-spin {
      to { transform: rotate(360deg); }
    }
    .gear {
      transform-origin: center;
      animation: gear-spin 3s linear infinite;
    }
    .gear-reverse {
      animation-direction: reverse;
      animation-duration: 2.2s;
    }

    @keyframes bar-grow {
      0%, 100% { transform: scaleY(0.45); }
      50% { transform: scaleY(1); }
    }
    .metric-bar {
      transform-origin: bottom center;
      animation: bar-grow 1.6s ease-in-out infinite;
    }
    .metric-bar.b2 { animation-delay: 0.2s; }
    .metric-bar.b3 { animation-delay: 0.4s; }
  </style>
</head>
<body>
  <div id="capture">
    <div class="header">
      <div>
        <h1>Build an ML Model — <em>6 Stages</em></h1>
        <p class="subtitle">Problem → Data → Model → Train → Evaluate → Deploy</p>
      </div>
      <div class="pill">Factory pipeline · feedback loops</div>
    </div>

    <svg class="flow" viewBox="0 0 1112 430" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7c3aed"/>
          <stop offset="100%" stop-color="#5b21b6"/>
        </linearGradient>
        <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f59e0b"/>
          <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
        <linearGradient id="beltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#334155"/>
          <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
        <linearGradient id="stationFill" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#f5f3ff"/>
        </linearGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6d28d9" flood-opacity="0.12"/>
        </filter>
        <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
        </marker>
        <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/>
        </marker>
        <pattern id="beltPattern" width="40" height="12" patternUnits="userSpaceOnUse">
          <rect width="40" height="12" fill="#475569"/>
          <rect x="0" y="5" width="40" height="2" fill="#64748b"/>
          <line x1="10" y1="0" x2="10" y2="12" stroke="#334155" stroke-width="2"/>
          <line x1="30" y1="0" x2="30" y2="12" stroke="#334155" stroke-width="2"/>
        </pattern>
      </defs>

      <!-- Top forward flow rail -->
      <rect x="40" y="98" width="1032" height="6" rx="3" fill="#ede9fe"/>
      <line x1="90" y1="118" x2="1090" y2="118" stroke="#c4b5fd" stroke-width="3" class="flow-line" marker-end="url(#arrowPurple)"/>
      <circle class="flow-dot" r="7" fill="#d97706" cx="0" cy="0"/>

      <!-- Feedback loops (waterfall style) -->
      <path class="feedback-arc feedback-line" d="M 980 248 Q 1040 300 980 352 Q 820 400 520 400 Q 220 400 160 352 Q 100 304 160 248"
            fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.55" marker-end="url(#arrowAmber)"/>
      <path class="feedback-arc feedback-line" d="M 820 248 Q 860 290 820 320 Q 680 360 420 360"
            fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.4" stroke-dasharray="5 5"/>
      <text x="556" y="392" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">monitor · retrain · fix data</text>

      <!-- ===== STATION 1: Problem ===== -->
      <g transform="translate(52, 128)">
        <ellipse class="station-glow s1" cx="60" cy="52" rx="72" ry="58" fill="#7c3aed" opacity="0.15"/>
        <rect x="0" y="0" width="120" height="108" rx="16" fill="url(#stationFill)" stroke="#7c3aed" stroke-width="2.5" filter="url(#softShadow)"/>
        <circle cx="60" cy="36" r="22" fill="#ede9fe"/>
        <circle cx="60" cy="36" r="14" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
        <circle cx="60" cy="36" r="5" fill="#7c3aed"/>
        <line x1="60" y1="36" x2="78" y2="28" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
        <text x="60" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#4c1d95">Problem</text>
        <text x="60" y="94" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">KPIs · scope</text>
      </g>

      <!-- ===== STATION 2: Data ===== -->
      <g transform="translate(212, 128)">
        <ellipse class="station-glow s2" cx="60" cy="52" rx="72" ry="58" fill="#7c3aed" opacity="0.15"/>
        <rect x="0" y="0" width="120" height="108" rx="16" fill="url(#stationFill)" stroke="#8b5cf6" stroke-width="2.5" filter="url(#softShadow)"/>
        <rect x="28" y="22" width="64" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
        <line x1="36" y1="32" x2="84" y2="32" stroke="#a78bfa" stroke-width="2"/>
        <line x1="36" y1="40" x2="72" y2="40" stroke="#c4b5fd" stroke-width="2"/>
        <line x1="36" y1="48" x2="80" y2="48" stroke="#c4b5fd" stroke-width="2"/>
        <text x="60" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#4c1d95">Data</text>
        <text x="60" y="94" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">clean · features</text>
      </g>

      <!-- ===== STATION 3: Model choice ===== -->
      <g transform="translate(372, 128)">
        <ellipse class="station-glow s3" cx="60" cy="52" rx="72" ry="58" fill="#7c3aed" opacity="0.15"/>
        <rect x="0" y="0" width="120" height="108" rx="16" fill="url(#stationFill)" stroke="#7c3aed" stroke-width="2.5" filter="url(#softShadow)"/>
        <circle cx="42" cy="38" r="8" fill="#7c3aed" opacity="0.85"/>
        <circle cx="60" cy="28" r="8" fill="#a78bfa"/>
        <circle cx="78" cy="38" r="8" fill="#7c3aed" opacity="0.85"/>
        <circle cx="52" cy="48" r="8" fill="#c4b5fd"/>
        <circle cx="68" cy="48" r="8" fill="#c4b5fd"/>
        <line x1="42" y1="38" x2="60" y2="28" stroke="#7c3aed" stroke-width="1.5"/>
        <line x1="60" y1="28" x2="78" y2="38" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="60" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#4c1d95">Model</text>
        <text x="60" y="94" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">algorithm pick</text>
      </g>

      <!-- ===== STATION 4: Train ===== -->
      <g transform="translate(532, 128)">
        <ellipse class="station-glow s4" cx="60" cy="52" rx="72" ry="58" fill="#d97706" opacity="0.12"/>
        <rect x="0" y="0" width="120" height="108" rx="16" fill="url(#stationFill)" stroke="#d97706" stroke-width="2.5" filter="url(#softShadow)"/>
        <g class="gear" transform="translate(60, 36)">
          <circle r="18" fill="none" stroke="#d97706" stroke-width="3"/>
          <circle r="6" fill="#d97706"/>
          <rect x="-3" y="-22" width="6" height="8" rx="2" fill="#d97706"/>
          <rect x="-3" y="14" width="6" height="8" rx="2" fill="#d97706"/>
          <rect x="-22" y="-3" width="8" height="6" rx="2" fill="#d97706"/>
          <rect x="14" y="-3" width="8" height="6" rx="2" fill="#d97706"/>
        </g>
        <g class="gear gear-reverse" transform="translate(88, 48) scale(0.55)">
          <circle r="18" fill="none" stroke="#f59e0b" stroke-width="4"/>
          <circle r="6" fill="#f59e0b"/>
        </g>
        <text x="60" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">Train</text>
        <text x="60" y="94" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">fit · tune</text>
      </g>

      <!-- ===== STATION 5: Evaluate ===== -->
      <g transform="translate(692, 128)">
        <ellipse class="station-glow s5" cx="60" cy="52" rx="72" ry="58" fill="#d97706" opacity="0.12"/>
        <rect x="0" y="0" width="120" height="108" rx="16" fill="url(#stationFill)" stroke="#d97706" stroke-width="2.5" filter="url(#softShadow)"/>
        <rect x="30" y="44" width="12" height="20" rx="2" fill="#fcd34d" class="metric-bar"/>
        <rect x="48" y="36" width="12" height="28" rx="2" fill="#f59e0b" class="metric-bar b2"/>
        <rect x="66" y="28" width="12" height="36" rx="2" fill="#d97706" class="metric-bar b3"/>
        <polyline points="34,42 52,34 70,26 88,30" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
        <text x="60" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">Evaluate</text>
        <text x="60" y="94" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">test · slices</text>
      </g>

      <!-- ===== STATION 6: Deploy ===== -->
      <g transform="translate(852, 128)">
        <ellipse class="station-glow s6" cx="60" cy="52" rx="72" ry="58" fill="#7c3aed" opacity="0.15"/>
        <rect x="0" y="0" width="120" height="108" rx="16" fill="url(#stationFill)" stroke="#7c3aed" stroke-width="2.5" filter="url(#softShadow)"/>
        <ellipse cx="60" cy="40" rx="28" ry="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
        <rect x="44" y="40" width="32" height="18" rx="4" fill="#7c3aed" opacity="0.2"/>
        <path d="M 60 22 L 68 36 L 52 36 Z" fill="#d97706"/>
        <circle cx="48" cy="52" r="3" fill="#22c55e" class="anim-dot"/>
        <circle cx="60" cy="52" r="3" fill="#22c55e" style="animation: arc-pulse 1s infinite 0.3s"/>
        <circle cx="72" cy="52" r="3" fill="#22c55e" style="animation: arc-pulse 1s infinite 0.6s"/>
        <text x="60" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#4c1d95">Deploy</text>
        <text x="60" y="94" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">API · monitor</text>
      </g>

      <!-- Conveyor belt assembly -->
      <g transform="translate(40, 268)">
        <rect x="0" y="0" width="1032" height="52" rx="10" fill="url(#beltGrad)"/>
        <clipPath id="beltClip">
          <rect x="0" y="0" width="1032" height="52" rx="10"/>
        </clipPath>
        <g clip-path="url(#beltClip)">
          <g class="belt-texture">
            <rect x="-40" y="8" width="1120" height="36" fill="url(#beltPattern)" opacity="0.55"/>
            <rect x="-40" y="44" width="1120" height="4" fill="#64748b"/>
          </g>
        </g>
        <!-- Rollers -->
        <g class="roller" transform="translate(120, 52)"><circle r="10" fill="#94a3b8" stroke="#475569" stroke-width="2"/><line x1="-10" y1="0" x2="10" y2="0" stroke="#334155" stroke-width="2"/></g>
        <g class="roller r2" transform="translate(360, 52)"><circle r="10" fill="#94a3b8" stroke="#475569" stroke-width="2"/><line x1="-10" y1="0" x2="10" y2="0" stroke="#334155" stroke-width="2"/></g>
        <g class="roller r3" transform="translate(600, 52)"><circle r="10" fill="#94a3b8" stroke="#475569" stroke-width="2"/><line x1="-10" y1="0" x2="10" y2="0" stroke="#334155" stroke-width="2"/></g>
        <g class="roller r4" transform="translate(840, 52)"><circle r="10" fill="#94a3b8" stroke="#475569" stroke-width="2"/><line x1="-10" y1="0" x2="10" y2="0" stroke="#334155" stroke-width="2"/></g>

        <!-- Moving package on belt -->
        <g class="belt-package" transform="translate(0, 14)">
          <rect x="0" y="0" width="44" height="28" rx="6" fill="url(#purpleGrad)" stroke="#f59e0b" stroke-width="2"/>
          <text x="22" y="19" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">ML</text>
        </g>
      </g>

      <!-- Stage labels under belt -->
      <text x="112" y="348" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">① Problem</text>
      <text x="272" y="348" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">② Data</text>
      <text x="432" y="348" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">③ Model</text>
      <text x="592" y="348" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">④ Train</text>
      <text x="752" y="348" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">⑤ Evaluate</text>
      <text x="912" y="348" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">⑥ Deploy</text>

      <!-- Legend -->
      <rect x="380" y="408" width="352" height="22" rx="8" fill="#fff" stroke="#e9d5ff"/>
      <line x1="400" y1="419" x2="430" y2="419" stroke="#7c3aed" stroke-width="3" class="flow-line"/>
      <text x="438" y="423" font-size="10" font-weight="600" fill="#475569">forward flow</text>
      <path d="M 530 419 Q 550 409 570 419" fill="none" stroke="#d97706" stroke-width="2" class="feedback-line"/>
      <text x="578" y="423" font-size="10" font-weight="600" fill="#475569">feedback loop</text>
    </svg>
  </div>
</body>
</html>
