<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>6 Steps Mix — ML Model Walkthrough</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #eef1f8;
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #capture {
      width: 1200px;
      height: 520px;
      background: linear-gradient(165deg, #faf8ff 0%, #f3eeff 40%, #fff8ed 100%);
      border-radius: 28px;
      padding: 32px 40px 28px;
      box-shadow: 0 24px 64px rgba(76, 29, 149, 0.14);
      overflow: hidden;
      position: relative;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 18px;
      position: relative;
      z-index: 5;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #1e1b4b;
    }
    h1 em {
      font-style: normal;
      background: linear-gradient(90deg, #6d28d9, #d97706);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .step-indicator {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .dot-ind {
      width: 36px;
      height: 8px;
      border-radius: 999px;
      background: #e2e8f0;
    }
    .dot-ind.d1 { animation: ind 12s step-end infinite; }
    .dot-ind.d2 { animation: ind 12s step-end infinite; animation-delay: -10s; }
    .dot-ind.d3 { animation: ind 12s step-end infinite; animation-delay: -8s; }
    .dot-ind.d4 { animation: ind 12s step-end infinite; animation-delay: -6s; }
    .dot-ind.d5 { animation: ind 12s step-end infinite; animation-delay: -4s; }
    .dot-ind.d6 { animation: ind 12s step-end infinite; animation-delay: -2s; }
    @keyframes ind {
      0%, 100% { background: #7c3aed; transform: scaleX(1.15); }
      16.67%, 83.33% { background: #e2e8f0; transform: scaleX(1); }
    }

    .stage-wrap {
      position: relative;
      height: 400px;
    }
    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
    }
    /* 12s loop, 2s per scene */
    .scene.s1 { animation: show1 12s ease-in-out infinite; }
    .scene.s2 { animation: show2 12s ease-in-out infinite; }
    .scene.s3 { animation: show3 12s ease-in-out infinite; }
    .scene.s4 { animation: show4 12s ease-in-out infinite; }
    .scene.s5 { animation: show5 12s ease-in-out infinite; }
    .scene.s6 { animation: show6 12s ease-in-out infinite; }

    @keyframes show1 { 0%, 2% { opacity: 0; } 4%, 14% { opacity: 1; } 18%, 100% { opacity: 0; } }
    @keyframes show2 { 0%, 14% { opacity: 0; } 18%, 28% { opacity: 1; } 32%, 100% { opacity: 0; } }
    @keyframes show3 { 0%, 28% { opacity: 0; } 32%, 42% { opacity: 1; } 46%, 100% { opacity: 0; } }
    @keyframes show4 { 0%, 42% { opacity: 0; } 46%, 56% { opacity: 1; } 60%, 100% { opacity: 0; } }
    @keyframes show5 { 0%, 56% { opacity: 0; } 60%, 70% { opacity: 1; } 74%, 100% { opacity: 0; } }
    @keyframes show6 { 0%, 70% { opacity: 0; } 74%, 84% { opacity: 1; } 88%, 100% { opacity: 0; } }

    .scene-label {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7c3aed;
      margin-bottom: 10px;
    }
    .scene-label span { color: #d97706; }
    svg { width: 100%; height: auto; display: block; }

    @keyframes dash { to { stroke-dashoffset: -20; } }
    .flow { stroke-dasharray: 8 6; animation: dash 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gear { transform-origin: center; animation: spin 2s linear infinite; }
    @keyframes bar-pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes blur-vague {
      0%, 30% { filter: blur(0); opacity: 1; }
      70%, 100% { filter: blur(6px); opacity: 0.35; }
    }
    @keyframes sharp-in {
      0%, 40% { filter: blur(4px); opacity: 0.4; }
      100% { filter: blur(0); opacity: 1; }
    }
    .vague-side { animation: blur-vague 2s ease-in-out infinite; }
    .sharp-side { animation: sharp-in 2s ease-in-out infinite; }
    @keyframes packet {
      0% { offset-distance: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    .pkt { offset-path: path("M 80 180 L 320 180 L 560 180 L 800 180"); animation: packet 2s ease-in-out infinite; }
    @keyframes orbit {
      0% { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }
    .orb { offset-path: path("M 556 80 A 80 80 0 1 1 555 80"); animation: orbit 2s linear infinite; }
  </style>
</head>
<body>
  <div id="capture">
    <div class="top">
      <h1><em>6 Steps</em> to Build an ML Model — full walkthrough</h1>
      <div class="step-indicator">
        <div class="dot-ind d1"></div>
        <div class="dot-ind d2"></div>
        <div class="dot-ind d3"></div>
        <div class="dot-ind d4"></div>
        <div class="dot-ind d5"></div>
        <div class="dot-ind d6"></div>
      </div>
    </div>

    <div class="stage-wrap">
      <!-- SCENE 1: Problem -->
      <div class="scene s1">
        <div class="scene-label">Step 1 · <span>Define problem</span></div>
        <svg viewBox="0 0 1120 340" xmlns="http://www.w3.org/2000/svg">
          <rect x="40" y="20" width="480" height="280" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
          <g class="vague-side">
            <text x="280" y="120" text-anchor="middle" font-size="32" font-weight="800" fill="#64748b">"Can we use AI?"</text>
            <text x="280" y="160" text-anchor="middle" font-size="14" fill="#94a3b8">too vague</text>
          </g>
          <text x="560" y="170" text-anchor="middle" font-size="28" fill="#7c3aed">→</text>
          <rect x="600" y="20" width="480" height="280" rx="18" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
          <g class="sharp-side">
            <text x="840" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#4c1d95">Predict churn in 30 days</text>
            <text x="840" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#d97706">recall ≥ 0.75 @ 10% alert</text>
            <text x="840" y="180" text-anchor="middle" font-size="13" fill="#64748b">KPIs · baseline · scope</text>
          </g>
        </svg>
      </div>

      <!-- SCENE 2: Data -->
      <div class="scene s2">
        <div class="scene-label">Step 2 · <span>Prepare data</span></div>
        <svg viewBox="0 0 1120 340" xmlns="http://www.w3.org/2000/svg">
          <text x="120" y="40" font-size="12" font-weight="800" fill="#64748b">RAW</text>
          <rect x="60" y="50" width="70" height="50" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="2" transform="rotate(-5 95 75)"/>
          <rect x="150" y="45" width="65" height="48" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
          <text x="200" y="130" font-size="10" font-weight="800" fill="#ef4444">LEAKAGE</text>
          <path d="M 556 60 L 500 200 L 612 200 Z" fill="url(#f1)" stroke="#7c3aed" stroke-width="2"/>
          <defs><linearGradient id="f1" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#d97706"/></linearGradient></defs>
          <text x="556" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">clean</text>
          <text x="556" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">encode</text>
          <text x="556" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">split</text>
          <rect x="820" y="80" width="260" height="160" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
          <rect x="840" y="100" width="220" height="28" rx="6" fill="#7c3aed"/>
          <text x="860" y="119" font-size="10" font-weight="700" fill="#fff">user_id · tenure · churn</text>
          <rect x="840" y="140" width="220" height="24" rx="4" fill="#fff"/>
          <rect x="840" y="172" width="220" height="24" rx="4" fill="#fff"/>
          <text x="950" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">train · val · test</text>
        </svg>
      </div>

      <!-- SCENE 3: Model -->
      <div class="scene s3">
        <div class="scene-label">Step 3 · <span>Choose model</span></div>
        <svg viewBox="0 0 1120 340" xmlns="http://www.w3.org/2000/svg">
          <rect x="200" y="30" width="720" height="280" rx="18" fill="#fff" stroke="#e9d5ff" stroke-width="2"/>
          <line x1="560" y1="30" x2="560" y2="310" stroke="#c4b5fd" stroke-dasharray="6 4"/>
          <line x1="200" y1="170" x2="920" y2="170" stroke="#fcd34d" stroke-dasharray="6 4"/>
          <text x="240" y="60" font-size="11" font-weight="700" fill="#64748b">High interpretability</text>
          <text x="240" y="320" font-size="11" font-weight="700" fill="#64748b">Low interpretability</text>
          <text x="380" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">Small data</text>
          <text x="740" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">Large data</text>
          <rect x="240" y="90" width="260" height="60" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
          <text x="370" y="128" text-anchor="middle" font-size="14" font-weight="800" fill="#4c1d95">Logistic Regression</text>
          <rect x="620" y="90" width="260" height="60" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
          <text x="750" y="128" text-anchor="middle" font-size="14" font-weight="800" fill="#4c1d95">Random Forest</text>
          <rect x="240" y="200" width="260" height="60" rx="12" fill="#fef3c7" stroke="#d97706"/>
          <text x="370" y="238" text-anchor="middle" font-size="14" font-weight="800" fill="#92400e">XGBoost</text>
          <rect x="620" y="200" width="260" height="60" rx="12" fill="#fef3c7" stroke="#d97706"/>
          <text x="750" y="238" text-anchor="middle" font-size="14" font-weight="800" fill="#92400e">Neural Net</text>
          <circle cx="370" cy="120" r="10" fill="#7c3aed" style="animation: bar-pulse 1s infinite"/>
        </svg>
      </div>

      <!-- SCENE 4: Train -->
      <div class="scene s4">
        <div class="scene-label">Step 4 · <span>Train &amp; tune</span></div>
        <svg viewBox="0 0 1120 340" xmlns="http://www.w3.org/2000/svg">
          <circle cx="320" cy="170" r="100" fill="none" stroke="#ede9fe" stroke-width="10"/>
          <circle cx="320" cy="170" r="100" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="10 8" class="flow"/>
          <circle cx="320" cy="70" r="20" fill="#7c3aed"/><text x="320" y="75" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">Train</text>
          <circle cx="420" cy="170" r="20" fill="#7c3aed"/><text x="420" y="175" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">Valid</text>
          <circle cx="320" cy="270" r="20" fill="#d97706"/><text x="320" y="275" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">Tune</text>
          <circle cx="220" cy="170" r="20" fill="#d97706"/><text x="220" y="175" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">Loop</text>
          <circle class="orb" r="6" fill="#d97706" cx="0" cy="0"/>
          <rect x="520" y="50" width="560" height="260" rx="16" fill="#fff" stroke="#e9d5ff" stroke-width="2"/>
          <text x="540" y="80" font-size="14" font-weight="800" fill="#4c1d95">Validation loss</text>
          <path d="M 560 100 C 640 220, 720 260, 980 270" fill="none" stroke="#7c3aed" stroke-width="3"/>
          <rect x="860" y="230" width="100" height="28" rx="8" fill="#d97706"/>
          <text x="910" y="249" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">STOP HERE</text>
        </svg>
      </div>

      <!-- SCENE 5: Evaluate -->
      <div class="scene s5">
        <div class="scene-label">Step 5 · <span>Evaluate &amp; test</span></div>
        <svg viewBox="0 0 1120 340" xmlns="http://www.w3.org/2000/svg">
          <rect x="40" y="40" width="160" height="70" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
          <text x="60" y="68" font-size="11" fill="#64748b">Recall</text>
          <text x="60" y="98" font-size="26" font-weight="900" fill="#4c1d95">0.76</text>
          <rect x="220" y="40" width="480" height="200" rx="14" fill="#fff" stroke="#e9d5ff" stroke-width="2"/>
          <text x="240" y="68" font-size="13" font-weight="800" fill="#4c1d95">Recall by region</text>
          <rect x="260" y="160" width="50" height="60" rx="4" fill="#a78bfa"/>
          <rect x="330" y="170" width="50" height="50" rx="4" fill="#a78bfa"/>
          <rect x="400" y="200" width="50" height="20" rx="4" fill="#ef4444" style="animation: bar-pulse 0.8s infinite"/>
          <text x="425" y="195" text-anchor="middle" font-size="10" font-weight="800" fill="#b91c1c">0.52</text>
          <text x="425" y="240" text-anchor="middle" font-size="10" fill="#64748b">APAC</text>
          <rect x="470" y="165" width="50" height="55" rx="4" fill="#a78bfa"/>
          <rect x="720" y="40" width="360" height="200" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
          <text x="740" y="72" font-size="14" font-weight="900" fill="#b91c1c">Investigate APAC</text>
          <text x="740" y="100" font-size="12" fill="#64748b">Slice failure hidden in aggregate</text>
          <rect x="740" y="120" width="200" height="32" rx="8" fill="#dc2626"/>
          <text x="840" y="141" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Fix before deploy</text>
        </svg>
      </div>

      <!-- SCENE 6: Deploy -->
      <div class="scene s6">
        <div class="scene-label">Step 6 · <span>Deploy &amp; monitor</span></div>
        <svg viewBox="0 0 1120 340" xmlns="http://www.w3.org/2000/svg">
          <line x1="100" y1="180" x2="900" y2="180" stroke="#c4b5fd" stroke-width="3" class="flow" marker-end="url(#arr)"/>
          <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/></marker></defs>
          <rect x="60" y="140" width="100" height="70" rx="12" fill="#7c3aed"/>
          <text x="110" y="172" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">Model</text>
          <rect x="280" y="140" width="100" height="70" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
          <text x="330" y="178" text-anchor="middle" font-size="11" font-weight="800" fill="#4c1d95">Docker</text>
          <rect x="500" y="130" width="110" height="90" rx="12" fill="#059669"/>
          <text x="555" y="168" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">API</text>
          <rect x="730" y="140" width="100" height="70" rx="12" fill="#fff" stroke="#10b981" stroke-width="2"/>
          <text x="780" y="178" text-anchor="middle" font-size="11" font-weight="800" fill="#047857">Users</text>
          <rect class="pkt" x="-20" y="-10" width="36" height="18" rx="5" fill="#7c3aed"/>
          <rect x="720" y="40" width="340" height="70" rx="12" fill="#fff" stroke="#d97706" stroke-width="2"/>
          <text x="740" y="68" font-size="12" font-weight="800" fill="#92400e">Metrics + drift alerts</text>
          <circle cx="1020" cy="55" r="8" fill="#ef4444"/>
          <path d="M 880 210 Q 980 280 880 300 Q 400 360 120 280 Q 40 240 100 200" fill="none" stroke="#d97706" stroke-width="2.5" class="flow" stroke-dasharray="8 6"/>
          <text x="560" y="320" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">retrain · fix data · rollback</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
