<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ML Step 3 — Model Selection Matrix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #eef1f8;
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #capture {
      width: 1200px;
      background: linear-gradient(165deg, #faf8ff 0%, #f3eeff 42%, #fff8ed 100%);
      border-radius: 28px;
      padding: 40px 44px 38px;
      box-shadow: 0 24px 64px rgba(76, 29, 149, 0.14);
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 26px;
    }
    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.6px;
      line-height: 1.1;
      color: #1e1b4b;
    }
    h1 em {
      font-style: normal;
      background: linear-gradient(90deg, #6d28d9, #d97706);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      margin-top: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #64748b;
    }
    .pill {
      background: #fff;
      border: 1px solid #e9d5ff;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      color: #5b21b6;
      box-shadow: 0 6px 20px rgba(109, 40, 217, 0.08);
    }
    svg.flow { width: 100%; height: auto; display: block; }

    @keyframes quad-highlight {
      0%, 100% { opacity: 0; }
      12%, 28% { opacity: 1; }
    }
    .quad-glow.q1 { animation: quad-highlight 6s ease-in-out infinite; animation-delay: 0.6s; }
    .quad-glow.q2 { animation: quad-highlight 6s ease-in-out infinite; animation-delay: 2.1s; }
    .quad-glow.q3 { animation: quad-highlight 6s ease-in-out infinite; animation-delay: 3.6s; }
    .quad-glow.q4 { animation: quad-highlight 6s ease-in-out infinite; animation-delay: 5.1s; }

    @keyframes dot-drop {
      0% { transform: translate(556px, -30px) scale(0.4); opacity: 0; }
      8% { opacity: 1; transform: translate(556px, 40px) scale(1); }
      22% { transform: var(--land) scale(1); opacity: 1; }
      30%, 88% { transform: var(--land) scale(1); opacity: 1; }
      96%, 100% { transform: var(--land) scale(0.6); opacity: 0; }
    }
    .dot.d1 { --land: translate(280px, 148px); animation: dot-drop 6s ease-in-out infinite; animation-delay: 0s; }
    .dot.d2 { --land: translate(832px, 148px); animation: dot-drop 6s ease-in-out infinite; animation-delay: 1.5s; }
    .dot.d3 { --land: translate(280px, 302px); animation: dot-drop 6s ease-in-out infinite; animation-delay: 3s; }
    .dot.d4 { --land: translate(832px, 302px); animation: dot-drop 6s ease-in-out infinite; animation-delay: 4.5s; }

    @keyframes label-pop {
      0%, 18% { opacity: 0; transform: scale(0.85); }
      24%, 88% { opacity: 1; transform: scale(1); }
      96%, 100% { opacity: 0; transform: scale(0.9); }
    }
    .model-label.l1 { animation: label-pop 6s ease-out infinite; animation-delay: 0.5s; }
    .model-label.l2 { animation: label-pop 6s ease-out infinite; animation-delay: 2s; }
    .model-label.l3 { animation: label-pop 6s ease-out infinite; animation-delay: 3.5s; }
    .model-label.l4 { animation: label-pop 6s ease-out infinite; animation-delay: 5s; }

    @keyframes axis-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .axis-label { animation: axis-pulse 3s ease-in-out infinite; }

    @keyframes ripple {
      0% { r: 8; opacity: 0.7; }
      100% { r: 36; opacity: 0; }
    }
    .ripple {
      animation: ripple 0.8s ease-out infinite;
    }
    .ripple.r1 { animation-delay: 0.55s; }
    .ripple.r2 { animation-delay: 2.05s; }
    .ripple.r3 { animation-delay: 3.55s; }
    .ripple.r4 { animation-delay: 5.05s; }
  </style>
</head>
<body>
  <div id="capture">
    <div class="header">
      <div>
        <h1>Step 3 — <em>Model Selection</em></h1>
        <p class="subtitle">Pick by data size × interpretability — not hype</p>
      </div>
      <div class="pill">~15% of the project</div>
    </div>

    <svg class="flow" viewBox="0 0 1112 380" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="purpleSoft" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ede9fe"/>
          <stop offset="100%" stop-color="#ddd6fe"/>
        </linearGradient>
        <linearGradient id="amberSoft" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fef3c7"/>
          <stop offset="100%" stop-color="#fde68a"/>
        </linearGradient>
        <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6d28d9" flood-opacity="0.12"/>
        </filter>
      </defs>

      <!-- Y-axis label -->
      <text class="axis-label" x="48" y="228" text-anchor="middle" font-size="12" font-weight="800" fill="#5b21b6" transform="rotate(-90 48 228)">INTERPRETABILITY →</text>
      <text x="78" y="132" font-size="11" font-weight="700" fill="#64748b">High</text>
      <text x="78" y="328" font-size="11" font-weight="700" fill="#64748b">Low</text>

      <!-- X-axis label -->
      <text class="axis-label" x="556" y="368" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">DATA SIZE →</text>
      <text x="280" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">Small</text>
      <text x="832" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">Large</text>

      <!-- Matrix frame -->
      <rect x="120" y="72" width="872" height="268" rx="18" fill="#fff" stroke="#e9d5ff" stroke-width="2" filter="url(#softShadow)"/>
      <line x1="556" y1="72" x2="556" y2="340" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 5"/>
      <line x1="120" y1="206" x2="992" y2="206" stroke="#fcd34d" stroke-width="2" stroke-dasharray="6 5"/>

      <!-- Quadrant backgrounds + glow -->
      <rect x="122" y="74" width="432" height="130" rx="16" fill="url(#purpleSoft)" opacity="0.45"/>
      <rect x="558" y="74" width="432" height="130" rx="16" fill="url(#purpleSoft)" opacity="0.25"/>
      <rect x="122" y="208" width="432" height="130" rx="16" fill="url(#amberSoft)" opacity="0.25"/>
      <rect x="558" y="208" width="432" height="130" rx="16" fill="url(#amberSoft)" opacity="0.45"/>

      <rect class="quad-glow q1" x="122" y="74" width="432" height="130" rx="16" fill="#7c3aed" opacity="0"/>
      <rect class="quad-glow q2" x="558" y="74" width="432" height="130" rx="16" fill="#7c3aed" opacity="0"/>
      <rect class="quad-glow q3" x="122" y="208" width="432" height="130" rx="16" fill="#d97706" opacity="0"/>
      <rect class="quad-glow q4" x="558" y="208" width="432" height="130" rx="16" fill="#d97706" opacity="0"/>

      <!-- Quadrant hints (minimal) -->
      <text x="338" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed" opacity="0.7">explainable · fast baseline</text>
      <text x="774" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed" opacity="0.7">structured · high volume</text>
      <text x="338" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309" opacity="0.7">flexible · still readable</text>
      <text x="774" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309" opacity="0.7">accuracy over explainability</text>

      <!-- Model labels (appear on land) -->
      <g class="model-label l1" transform="translate(338, 158)" opacity="0">
        <rect x="-108" y="-22" width="216" height="44" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
        <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Logistic Regression</text>
      </g>
      <g class="model-label l2" transform="translate(774, 158)" opacity="0">
        <rect x="-92" y="-22" width="184" height="44" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
        <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="800" fill="#4c1d95">Random Forest</text>
      </g>
      <g class="model-label l3" transform="translate(338, 312)" opacity="0">
        <rect x="-92" y="-22" width="184" height="44" rx="12" fill="#fff" stroke="#d97706" stroke-width="2"/>
        <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="800" fill="#92400e">XGBoost</text>
      </g>
      <g class="model-label l4" transform="translate(774, 312)" opacity="0">
        <rect x="-88" y="-22" width="176" height="44" rx="12" fill="#fff" stroke="#d97706" stroke-width="2"/>
        <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="800" fill="#92400e">Neural Net</text>
      </g>

      <!-- Landing ripples -->
      <circle class="ripple r1" cx="280" cy="148" r="8" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0"/>
      <circle class="ripple r2" cx="832" cy="148" r="8" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0"/>
      <circle class="ripple r3" cx="280" cy="302" r="8" fill="none" stroke="#d97706" stroke-width="2" opacity="0"/>
      <circle class="ripple r4" cx="832" cy="302" r="8" fill="none" stroke="#d97706" stroke-width="2" opacity="0"/>

      <!-- Animated dots -->
      <g class="dot d1">
        <circle r="14" fill="#7c3aed" opacity="0.25"/>
        <circle r="9" fill="#7c3aed"/>
        <circle r="4" fill="#fff"/>
      </g>
      <g class="dot d2">
        <circle r="14" fill="#7c3aed" opacity="0.25"/>
        <circle r="9" fill="#7c3aed"/>
        <circle r="4" fill="#fff"/>
      </g>
      <g class="dot d3">
        <circle r="14" fill="#d97706" opacity="0.25"/>
        <circle r="9" fill="#d97706"/>
        <circle r="4" fill="#fff"/>
      </g>
      <g class="dot d4">
        <circle r="14" fill="#d97706" opacity="0.25"/>
        <circle r="9" fill="#d97706"/>
        <circle r="4" fill="#fff"/>
      </g>

      <!-- Drop origin indicator -->
      <rect x="524" y="44" width="64" height="22" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="556" y="59" text-anchor="middle" font-size="9" font-weight="800" fill="#64748b">YOUR PROJECT</text>

      <!-- Footer tip -->
      <rect x="300" y="348" width="512" height="24" rx="8" fill="#fff" stroke="#e9d5ff"/>
      <text x="556" y="364" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Start simple in your quadrant — upgrade only if validation metrics stall</text>
    </svg>
  </div>
</body>
</html>
