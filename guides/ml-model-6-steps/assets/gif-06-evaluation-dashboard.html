<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ML Step 5 — Evaluation Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #eef1f8; margin: 0; padding: 12px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #capture {
      width: 1200px;
      background: linear-gradient(165deg, #faf8ff 0%, #f3eeff 42%, #fff8ed 100%);
      border-radius: 28px; padding: 40px 44px 38px;
      box-shadow: 0 24px 64px rgba(76, 29, 149, 0.14); overflow: hidden;
    }
    .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
    h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1; color: #1e1b4b; }
    h1 em { font-style: normal; background: linear-gradient(90deg, #6d28d9, #d97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { margin-top: 8px; font-size: 15px; font-weight: 600; color: #64748b; }
    .pill { background: #fff; border: 1px solid #e9d5ff; border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 600; color: #5b21b6; }
    svg.flow { width: 100%; height: auto; display: block; }

    @keyframes metric-pop {
      0%, 12% { transform: scale(0.92); opacity: 0.5; }
      22%, 100% { transform: scale(1); opacity: 1; }
    }
    .metric-card.c1 { animation: metric-pop 5s ease-out infinite; animation-delay: 0s; }
    .metric-card.c2 { animation: metric-pop 5s ease-out infinite; animation-delay: 0.2s; }
    .metric-card.c3 { animation: metric-pop 5s ease-out infinite; animation-delay: 0.4s; }

    @keyframes bar-grow {
      0%, 20% { transform: scaleY(0); }
      35%, 100% { transform: scaleY(1); }
    }
    .slice-bar { transform-origin: bottom center; animation: bar-grow 5s ease-out infinite; }
    .slice-bar.b1 { animation-delay: 0.5s; }
    .slice-bar.b2 { animation-delay: 0.65s; }
    .slice-bar.b3 { animation-delay: 0.8s; }
    .slice-bar.b4 { animation-delay: 0.95s; }

    @keyframes bad-flash {
      0%, 45% { fill: #a78bfa; }
      50%, 78% { fill: #ef4444; }
      85%, 100% { fill: #a78bfa; }
    }
    .bar-bad { animation: bad-flash 5s ease-in-out infinite; }

    @keyframes zoom-in {
      0%, 48% { transform: scale(1) translate(0, 0); opacity: 0; }
      55%, 82% { transform: scale(1.08) translate(-24px, -12px); opacity: 1; }
      92%, 100% { transform: scale(1); opacity: 0; }
    }
    .zoom-panel { transform-origin: 720px 260px; animation: zoom-in 5s ease-in-out infinite; }

    @keyframes pulse-ring {
      0%, 100% { opacity: 0.3; r: 6; }
      50% { opacity: 1; r: 10; }
    }
    .alert-dot { animation: pulse-ring 1.2s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="capture">
    <div class="header">
      <div>
        <h1>Step 5 — <em>Evaluate &amp; Test</em></h1>
        <p class="subtitle">Test-set metrics + slice analysis before you ship</p>
      </div>
      <div class="pill">Held-out test set</div>
    </div>

    <svg class="flow" viewBox="0 0 1112 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#6d28d9" flood-opacity="0.12"/></filter>
      </defs>

      <!-- Metric cards -->
      <g class="metric-card c1">
        <rect x="40" y="56" width="200" height="88" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
        <text x="60" y="84" font-size="11" font-weight="700" fill="#64748b">Accuracy</text>
        <text x="60" y="118" font-size="28" font-weight="900" fill="#4c1d95">0.91</text>
        <text x="200" y="118" text-anchor="end" font-size="10" font-weight="700" fill="#059669">↑ ok</text>
      </g>
      <g class="metric-card c2">
        <rect x="260" y="56" width="200" height="88" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
        <text x="280" y="84" font-size="11" font-weight="700" fill="#64748b">Recall</text>
        <text x="280" y="118" font-size="28" font-weight="900" fill="#4c1d95">0.76</text>
        <text x="420" y="118" text-anchor="end" font-size="10" font-weight="700" fill="#059669">↑ target</text>
      </g>
      <g class="metric-card c3">
        <rect x="480" y="56" width="200" height="88" rx="14" fill="#fff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
        <text x="500" y="84" font-size="11" font-weight="700" fill="#64748b">F1 score</text>
        <text x="500" y="118" font-size="28" font-weight="900" fill="#92400e">0.79</text>
        <text x="640" y="118" text-anchor="end" font-size="10" font-weight="700" fill="#d97706">watch</text>
      </g>

      <!-- Slice chart -->
      <rect x="40" y="168" width="640" height="172" rx="16" fill="#fff" stroke="#e9d5ff" stroke-width="2" filter="url(#shadow)"/>
      <text x="60" y="196" font-size="13" font-weight="800" fill="#4c1d95">Recall by region (test set)</text>

      <rect class="slice-bar b1" x="80" y="248" width="56" height="72" rx="6" fill="#a78bfa"/>
      <text x="108" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">NA</text>
      <text x="108" y="240" text-anchor="middle" font-size="10" font-weight="800" fill="#5b21b6">0.81</text>

      <rect class="slice-bar b2" x="180" y="260" width="56" height="60" rx="6" fill="#a78bfa"/>
      <text x="208" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">EU</text>
      <text x="208" y="252" text-anchor="middle" font-size="10" font-weight="800" fill="#5b21b6">0.78</text>

      <rect class="slice-bar b3 bar-bad" x="280" y="290" width="56" height="30" rx="6"/>
      <text x="308" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">APAC</text>
      <text x="308" y="282" text-anchor="middle" font-size="10" font-weight="800" fill="#b91c1c">0.52</text>
      <circle class="alert-dot" cx="308" cy="276" r="6" fill="#ef4444"/>

      <rect class="slice-bar b4" x="380" y="255" width="56" height="65" rx="6" fill="#a78bfa"/>
      <text x="408" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">LATAM</text>
      <text x="408" y="247" text-anchor="middle" font-size="10" font-weight="800" fill="#5b21b6">0.74</text>

      <line x1="60" y1="320" x2="620" y2="320" stroke="#e2e8f0" stroke-width="2"/>

      <!-- Zoom panel -->
      <g class="zoom-panel">
        <rect x="720" y="168" width="352" height="172" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5" filter="url(#shadow)"/>
        <text x="740" y="196" font-size="13" font-weight="900" fill="#b91c1c">⚠ Investigate APAC</text>
        <text x="740" y="222" font-size="11" font-weight="600" fill="#64748b">Recall 0.52 vs 0.76 overall</text>
        <rect x="740" y="238" width="312" height="28" rx="8" fill="#fff" stroke="#fecaca"/>
        <text x="756" y="257" font-size="10" font-weight="700" fill="#334155">Possible label drift · sparse training rows</text>
        <rect x="740" y="276" width="140" height="28" rx="8" fill="#dc2626"/>
        <text x="810" y="295" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Fix before deploy</text>
      </g>

      <text x="556" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Aggregate metrics hide segment failures — always slice</text>
    </svg>
  </div>
</body>
</html>
