<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ML Step 4 — Train Loop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #eef1f8; margin: 0; padding: 12px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #capture {
      width: 1200px;
      background: linear-gradient(165deg, #faf8ff 0%, #f3eeff 42%, #fff8ed 100%);
      border-radius: 28px; padding: 40px 44px 38px;
      box-shadow: 0 24px 64px rgba(76, 29, 149, 0.14); overflow: hidden;
    }
    .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
    h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1; color: #1e1b4b; }
    h1 em { font-style: normal; background: linear-gradient(90deg, #6d28d9, #d97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { margin-top: 8px; font-size: 15px; font-weight: 600; color: #64748b; }
    .pill { background: #fff; border: 1px solid #e9d5ff; border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 600; color: #5b21b6; box-shadow: 0 6px 20px rgba(109, 40, 217, 0.08); }
    svg.flow { width: 100%; height: auto; display: block; }

    @keyframes dash-flow { to { stroke-dashoffset: -24; } }
    .flow-line { stroke-dasharray: 10 8; animation: dash-flow 1.1s linear infinite; }

    @keyframes orbit-dot {
      0% { offset-distance: 0%; opacity: 1; }
      100% { offset-distance: 100%; opacity: 1; }
    }
    .orbit-dot { offset-path: path("M 556 118 A 118 118 0 1 1 555.9 118"); animation: orbit-dot 4s linear infinite; }

    @keyframes step-glow {
      0%, 100% { opacity: 0.2; }
      8%, 22% { opacity: 1; }
    }
    .step-glow.s1 { animation: step-glow 4s ease-in-out infinite; animation-delay: 0s; }
    .step-glow.s2 { animation: step-glow 4s ease-in-out infinite; animation-delay: 1s; }
    .step-glow.s3 { animation: step-glow 4s ease-in-out infinite; animation-delay: 2s; }
    .step-glow.s4 { animation: step-glow 4s ease-in-out infinite; animation-delay: 3s; }

    @keyframes draw-loss {
      0% { stroke-dashoffset: 420; }
      100% { stroke-dashoffset: 0; }
    }
    .loss-line {
      stroke-dasharray: 420;
      stroke-dashoffset: 420;
      animation: draw-loss 5s ease-out infinite;
    }

    @keyframes stop-pulse {
      0%, 55% { opacity: 0; transform: scale(0.9); }
      65%, 88% { opacity: 1; transform: scale(1); }
      96%, 100% { opacity: 0; }
    }
    .stop-badge { transform-origin: 720px 248px; animation: stop-pulse 5s ease-in-out infinite; }

    @keyframes gear-spin { to { transform: rotate(360deg); } }
    .gear { transform-origin: center; animation: gear-spin 2.5s linear infinite; }
  </style>
</head>
<body>
  <div id="capture">
    <div class="header">
      <div>
        <h1>Step 4 — <em>Train &amp; Iterate</em></h1>
        <p class="subtitle">Train → validate → adjust — until metrics plateau</p>
      </div>
      <div class="pill">Hyperparameter loop</div>
    </div>

    <svg class="flow" viewBox="0 0 1112 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
        <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#6d28d9" flood-opacity="0.15"/></filter>
      </defs>

      <!-- Circular loop -->
      <circle cx="556" cy="118" r="118" fill="none" stroke="#ede9fe" stroke-width="14"/>
      <circle cx="556" cy="118" r="118" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="12 8" class="flow-line" opacity="0.7"/>

      <!-- Step nodes -->
      <g class="step-glow s1"><circle cx="556" cy="0" r="28" fill="#7c3aed" opacity="0.2"/></g>
      <g class="step-glow s2"><circle cx="674" cy="118" r="28" fill="#7c3aed" opacity="0.2"/></g>
      <g class="step-glow s3"><circle cx="556" cy="236" r="28" fill="#d97706" opacity="0.2"/></g>
      <g class="step-glow s4"><circle cx="438" cy="118" r="28" fill="#d97706" opacity="0.2"/></g>

      <circle cx="556" cy="0" r="22" fill="#7c3aed" filter="url(#shadow)"/>
      <text x="556" y="5" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Train</text>

      <circle cx="674" cy="118" r="22" fill="#7c3aed" filter="url(#shadow)"/>
      <text x="674" y="115" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">Validate</text>

      <circle cx="556" cy="236" r="22" fill="#d97706" filter="url(#shadow)"/>
      <text x="556" y="241" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">Adjust</text>

      <circle cx="438" cy="118" r="22" fill="#d97706" filter="url(#shadow)"/>
      <text x="438" y="115" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">Repeat</text>

      <g class="gear" transform="translate(556, 118)">
        <circle r="18" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.5"/>
        <circle r="5" fill="#a78bfa" opacity="0.6"/>
      </g>

      <circle class="orbit-dot" r="7" fill="#d97706" cx="0" cy="0"/>

      <!-- Loss chart -->
      <rect x="680" y="48" width="380" height="280" rx="16" fill="#fff" stroke="#e9d5ff" stroke-width="2" filter="url(#shadow)"/>
      <text x="700" y="76" font-size="13" font-weight="800" fill="#4c1d95">Validation loss</text>
      <text x="1020" y="76" text-anchor="end" font-size="10" font-weight="600" fill="#64748b">epoch →</text>

      <line x1="700" y1="300" x2="1040" y2="300" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="700" y1="100" x2="700" y2="300" stroke="#cbd5e1" stroke-width="2"/>
      <text x="692" y="110" text-anchor="end" font-size="9" fill="#94a3b8">low</text>
      <text x="692" y="304" text-anchor="end" font-size="9" fill="#94a3b8">high</text>

      <path class="loss-line" d="M 720 120 C 780 200, 820 240, 860 255 S 940 268, 980 270 L 1020 272"
            fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 980 270 L 1020 272" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

      <line x1="980" y1="100" x2="980" y2="300" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" opacity="0.6"/>

      <g class="stop-badge">
        <rect x="720" y="228" width="108" height="32" rx="10" fill="#d97706"/>
        <text x="774" y="249" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">STOP HERE</text>
      </g>
      <text x="990" y="292" font-size="10" font-weight="700" fill="#b45309">plateau</text>

      <!-- Epoch counter -->
      <rect x="700" y="88" width="72" height="24" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
      <text x="736" y="104" text-anchor="middle" font-size="10" font-weight="800" fill="#5b21b6">epoch 47</text>
    </svg>
  </div>
</body>
</html>
