<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c1222;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif}
#capture{width:1100px;padding:32px 36px;background:linear-gradient(165deg,#0c1222,#132238 50%,#0c1222);border-radius:20px;border:1px solid rgba(14,165,233,.25)}
.ey{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#0ea5e9;margin-bottom:8px}
h1{font-size:24px;font-weight:800;color:#f0f9ff;margin-bottom:20px} h1 span{color:#38bdf8}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.node{opacity:.15;transform:translateY(8px);min-width:110px;padding:14px 16px;border-radius:12px;background:rgba(15,23,42,.85);border:1px solid rgba(51,65,85,.8);text-align:center}
.node.visible{opacity:1;transform:none}.node.active{border-color:#0ea5e9;box-shadow:0 0 20px rgba(14,165,233,.15)}
.node h2{font-size:12px;color:#f0f9ff;margin-bottom:4px}.node p{font-size:10px;color:#94a3b8;line-height:1.4}
.arrow{color:#334155;font-size:20px;opacity:.2}.arrow.visible{opacity:1;color:#0ea5e9}
.stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:560px;margin:0 auto}
.tier{opacity:.15;transform:translateX(-8px);padding:12px 16px;border-radius:10px;border:1px solid rgba(51,65,85,.7);background:rgba(15,23,42,.8)}
.tier.visible{opacity:1;transform:none}.tier.active{border-color:#0ea5e9}
.tier strong{color:#7dd3fc;font-size:12px;display:block;margin-bottom:4px}.tier span{font-size:11px;color:#94a3b8}
</style>
</head>
<body>
<div id="capture"><div class="ey" id="ey"></div><h1 id="title"></h1><div id="content"></div></div>
<script>
const D={
"openclaude-stack":{ey:"OpenClaude · GitLawb",title:'Coding <span>harness</span>',nodes:["Terminal REPL","69+ slash cmds","Tools + MCP","Provider profile","Any model backend"]},
"provider-profiles":{ey:"/provider",title:'Saved <span>profiles</span>',nodes:["/provider wizard",".openclaude-profile.json","OpenAI · Ollama","Gemini · GitHub","Opengateway · Zen"]},
"slash-commands":{ey:"Reference",title:'Slash <span>commands</span>',type:"stack",
tiers:[["Sessions","/resume · /branch · /rewind · /export"],["Review","/diff · /review · /plan · /security-review"],["Tools","/mcp · /permissions · /skills · /agents"],["Context","/init · /memory · /cost · /compact"]]},
"agent-routing":{ey:"~/.openclaude.json",title:'Agent <span>routing</span>',nodes:["agentModels","agentRouting","Explore → cheap","verification → mini","default → strong"]},
};
function flow(nodes,prog){const total=nodes.length*2-1;const vis=Math.ceil(prog*total);let html='<div class="row">',idx=0;
nodes.forEach((n,i)=>{html+=`<div class="node${idx<vis?" visible":""}${idx===vis-1?" active":""}"><h2>${n}</h2></div>`;idx++;
if(i<nodes.length-1){html+=`<span class="arrow${idx<vis?" visible":""}">→</span>`;idx++;}});return html+'</div>';}
function render(id,prog){const d=D[id];if(!d)return;document.getElementById("ey").textContent=d.ey;
document.getElementById("title").innerHTML=d.title;const el=document.getElementById("content");
if(d.type==="stack"){const vis=Math.ceil(prog*d.tiers.length);el.innerHTML='<div class="stack">'+d.tiers.map((t,i)=>
`<div class="tier${i<vis?" visible":""}${i===vis-1?" active":""}"><strong>${t[0]}</strong><span>${t[1]}</span></div>`).join('')+'</div>';}
else el.innerHTML=flow(d.nodes,prog);}
const p=new URLSearchParams(location.search);render(p.get("diagram")||"openclaude-stack",parseFloat(p.get("frame")||"1"));
window.__READY=true;
</script>
</body>
</html>
