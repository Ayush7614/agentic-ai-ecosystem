<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#132238 0%,#0c1222 55%,#060a12 100%);font-family:"JetBrains Mono",monospace}
#capture{width:920px;padding:28px}
.terminal{border-radius:12px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55);background:#0f172a;border:1px solid rgba(14,165,233,.15)}
.titlebar{height:44px;background:linear-gradient(180deg,#1e293b,#0f172a);display:flex;align-items:center;padding:0 16px;gap:8px;border-bottom:1px solid rgba(0,0,0,.35)}
.dot{width:13px;height:13px;border-radius:50%}.dot.red{background:#ff5f57}.dot.yellow{background:#febc2e}.dot.green{background:#28c840}
.titlebar-label{flex:1;text-align:center;font-size:12px;color:#38bdf8;margin-right:52px}
.body{min-height:340px;padding:28px 32px 36px;background:#0c1222;font-size:14px;line-height:1.72;color:#cbd5e1}
.line{white-space:pre-wrap}.prompt-user{color:#38bdf8;font-weight:500}.prompt-path{color:#7dd3fc}
.prompt-arrow{color:#0ea5e9;margin:0 6px 0 2px}.cmd{color:#f0f9ff}.dim{color:#64748b}.success{color:#6ee7b7}.info{color:#7dd3fc}
</style>
</head>
<body>
<div id="capture"><div class="terminal"><div class="titlebar"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
<span class="titlebar-label">OpenClaude — Agent Masterclass</span></div><div class="body" id="body"></div></div></div>
<script>
const STEPS={
"01-install-provider":{user:"dev",path:"my-repo",lines:[
{type:"cmd",text:"npm install -g @gitlawb/openclaude@latest"},
{type:"success",text:"openclaude v0.18.0"},
{type:"cmd",text:"openclaude"},
{type:"info",text:"/provider → OpenAI · Ollama · Opengateway"},
{type:"success",text:"Profile saved → .openclaude-profile.json"},
]},
"02-first-task":{user:"dev",path:"my-repo",lines:[
{type:"cmd",text:"> add retry with backoff to fetch client, run tests"},
{type:"info",text:"Streaming plan · reading src/client.ts"},
{type:"info",text:"Tool: bash · npm test"},
{type:"success",text:"Tests green · diff ready for review"},
]},
"03-init-permissions":{user:"dev",path:"my-repo",lines:[
{type:"cmd",text:"/init"},
{type:"success",text:"Project instructions written"},
{type:"cmd",text:"/permissions"},
{type:"info",text:"Allow: read · grep · Deny: rm -rf"},
{type:"success",text:"Rules saved for this project"},
]},
"04-diff-rewind":{user:"dev",path:"my-repo",lines:[
{type:"cmd",text:"/diff"},
{type:"info",text:"3 files changed · per-turn diffs"},
{type:"cmd",text:"/cost"},
{type:"info",text:"Session: $0.42 · 12m"},
{type:"cmd",text:"/rewind"},
{type:"success",text:"Restored previous turn"},
]},
"05-bg-session":{user:"dev",path:"~",lines:[
{type:"cmd",text:"openclaude --bg --name tests \"fix failing tests\""},
{type:"success",text:"Background session started"},
{type:"cmd",text:"openclaude ps"},
{type:"cmd",text:"openclaude logs tests -f"},
{type:"dim",text:"# ~/.openclaude/bg-sessions/"},
]},
};
function render(step,prog){const s=STEPS[step];if(!s)return;const vis=Math.max(1,Math.ceil(prog*s.lines.length));
let h=`<div class="line"><span class="prompt-user">${s.user}</span><span class="prompt-path">${s.path}</span><span class="prompt-arrow">›</span></div>`;
for(let i=0;i<vis&&i<s.lines.length;i++){const l=s.lines[i];const cls=l.type==="cmd"?"cmd":l.type==="success"?"success":l.type==="info"?"info":"dim";
if(l.type==="cmd")h+=`<div class="line"><span class="${cls}">${l.text}</span></div>`;
else h+=`<div class="line"><span class="${cls}">${l.text}</span></div>`;}
document.getElementById("body").innerHTML=h;}
const p=new URLSearchParams(location.search);render(p.get("step")||"01-install-provider",parseFloat(p.get("frame")||"1"));
window.__READY=true;
</script>
</body>
</html>
